apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blackbox
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: "9115", protocol: TCP }]
  egress:
    # Each probed pod admits the prober in its own policy; this is the other
    # half. Service ClusterIPs resolve to these pod ports before policy.
    - toEndpoints:
        - matchLabels: { app: plex, k8s:io.kubernetes.pod.namespace: plex }
      toPorts:
        - ports: [{ port: "32400", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: jellyfin, k8s:io.kubernetes.pod.namespace: jellyfin }
        - matchLabels: { app: emby, k8s:io.kubernetes.pod.namespace: emby }
      toPorts:
        - ports: [{ port: "8096", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: authentik, component: server, k8s:io.kubernetes.pod.namespace: authentik }
      toPorts:
        - ports: [{ port: "9000", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: headscale, k8s:io.kubernetes.pod.namespace: headscale }
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: ntfy, k8s:io.kubernetes.pod.namespace: ntfy }
        - matchLabels: { app: gotify, k8s:io.kubernetes.pod.namespace: gotify }
      toPorts:
        - ports: [{ port: "80", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app.kubernetes.io/name: grafana }
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: minecraft, k8s:io.kubernetes.pod.namespace: minecraft }
      toPorts:
        - ports: [{ port: "25565", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: minecraft-makoto, k8s:io.kubernetes.pod.namespace: minecraft }
      toPorts:
        - ports: [{ port: "25566", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: terraria, k8s:io.kubernetes.pod.namespace: terraria }
      toPorts:
        - ports: [{ port: "7777", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: terraria-makoto, k8s:io.kubernetes.pod.namespace: terraria }
      toPorts:
        - ports: [{ port: "7779", protocol: TCP }]
    # ICMP echo to the three NAS boxes. The DNS probe targets node-local-dns on
    # the host, which the baseline already allows.
    - toCIDR:
        - 192.168.1.2/32
        - 192.168.1.3/32
        - 192.168.1.4/32
      icmps:
        - fields:
            - type: 8
              family: IPv4
