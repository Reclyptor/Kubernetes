# node-exporter itself runs on the host network and is governed by the node
# firewall, not by endpoint policy. vlagent is an ordinary pod and needs these.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vlagent
  namespace: node-exporter
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vlagent
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9429", protocol: TCP }]
  egress:
    # Pod metadata for the log streams it tails.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vlsingle
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9428", protocol: TCP }]
