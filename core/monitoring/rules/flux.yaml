apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: flux
  namespace: monitoring
spec:
  groups:
    - name: flux
      rules:
        - alert: FluxResourceNotReady
          expr: gotk_resource_info{ready="False"} == 1
          for: 30m
          labels: { severity: warning, notify: ntfy }
          annotations:
            summary: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has not been Ready for 30 minutes"
            description: "Git says one thing and the cluster another; check `flux get {{ $labels.customresource_kind }} -A`."
        - alert: FluxResourceSuspended
          expr: gotk_resource_info{suspended="true"} == 1
          for: 24h
          labels: { severity: warning, notify: ntfy }
          annotations:
            summary: "{{ $labels.customresource_kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been suspended for a day"
            description: "Nothing in it reconciles or prunes until it is resumed."
