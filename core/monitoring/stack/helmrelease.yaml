apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  interval: 10m
  timeout: 10m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: 0.95.0
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  # The chart copies the VictoriaLogs image tag into app.kubernetes.io/version,
  # and a tag@digest pin is not a valid label value (the metrics templates do
  # not do this). Keep the digest on the image and the plain version on the label.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: VLSingle
            patch: |
              - op: replace
                path: /metadata/labels/app.kubernetes.io~1version
                value: v1.52.0
          - target:
              kind: VLAgent
            patch: |
              - op: replace
                path: /metadata/labels/app.kubernetes.io~1version
                value: v1.52.0
  values:
    victoria-metrics-operator:
      image:
        tag: v0.75.0@sha256:78da26b41a819093707be2ab6a65a5dc19f43d58ec52f30b49a545c2c6b7bd55
      crds:
        # Ship the CRDs through Helm's crds/ path so they exist before the
        # release manifest is validated; templated CRDs fail that check. Flux's
        # CreateReplace policy above is what keeps this path upgradable.
        plain: true
        cleanup:
          # The uninstall hook would delete every VM custom resource with the CRDs.
          enabled: false
      operator:
        # No Prometheus Operator CRDs on this cluster; every scrape is a VM-native CR.
        disable_prometheus_converter: true
      env:
        # The config-reloader sidecar the operator injects into every VM pod;
        # its default is tag-only.
        - name: VM_CONFIG_RELOADER_IMAGE
          value: victoriametrics/operator:config-reloader-v0.75.0@sha256:11c5d33b2112571e72cdc020b63c8045f2cd523fec4768b67a91f96e36b05c59

    # Cilium's own dashboards, pinned to the running release's tag; the sync
    # job below fetches them like the bundled ones.
    defaultDashboards:
      sources:
        cilium-agent:
          url: https://raw.githubusercontent.com/cilium/cilium/v1.19.8/install/kubernetes/cilium/files/cilium-agent/dashboards/cilium-dashboard.json
        cilium-operator:
          url: https://raw.githubusercontent.com/cilium/cilium/v1.19.8/install/kubernetes/cilium/files/cilium-operator/dashboards/cilium-operator-dashboard.json
        hubble:
          url: https://raw.githubusercontent.com/cilium/cilium/v1.19.8/install/kubernetes/cilium/files/hubble/dashboards/hubble-dashboard.json

    # Post-install hook that fetches the bundled dashboards from GitHub. The
    # network policy grants that one pod raw.githubusercontent.com and nothing else.
    syncJob:
      image:
        tag: v0.0.17@sha256:b6f233532a85cda65e645264d24f995e5ee97f88b60610643f01f170516f444b

    vmsingle:
      spec:
        retentionPeriod: "3"
        image:
          tag: v1.153.0@sha256:5eff7af5341e401471002f58d106d399e614a62f3d240f2dbc21901e49eed5dd
        storage:
          storageClassName: iscsi-persistent-fs6712x
          resources:
            requests:
              storage: 20Gi

    # Logs: VictoriaLogs and the per-node collector, both from this chart and
    # managed by the same operator (decision 2026-10-03, supersedes the separate
    # victoria-logs-single chart named in the spec).
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: "30d"
        image:
          tag: v1.52.0@sha256:47b820890d64c4575a2a0a46415dcd8a4fd59a0f1fcd6a377693d7aea639442e
        storage:
          storageClassName: iscsi-persistent-fs6712x
          resources:
            requests:
              storage: 20Gi
    vlagent:
      enabled: true
      # Reads /var/log/pods on every node through a hostPath mount, which PSA
      # baseline forbids; the node-exporter namespace is the privileged one.
      namespaceOverride: node-exporter
      spec:
        image:
          tag: v1.52.0@sha256:5f8bb5cfde9745c02c3301426cad6fab4ef1d382161af577d284cccc9136b99c
        # bytheon carries the nvidia.com/gpu taint; logs come from there too.
        tolerations:
          - operator: Exists
            effect: NoSchedule

    # Created by the chart once metrics and logs both exist: vmalert queries
    # through it so logs rules work. Pinned like everything else.
    internal:
      vmauth:
        spec:
          image:
            tag: v1.153.0@sha256:4ebf2f21490df3e8837302b85d9db6ac45765442dfa28db77ffacd3577035a74

    vmagent:
      spec:
        image:
          tag: v1.153.0@sha256:474135388ae700b842007d3e186a8ae60ccf7de3dfd776fb6ed27cf8522d8331

    vmalert:
      spec:
        image:
          tag: v1.153.0@sha256:0c1c7718b54b03e8559d0f257f31f1bd79ef7fa32ac6e9ed90d7b92a74a4fe76

    alertmanager:
      spec:
        image:
          tag: v0.34.0@sha256:690c7b525f4367aa91f73e2f91c632206d32e97c6384bdbf2fb7a861b420340d
        # Routing lives in a SOPS secret (it carries the ntfy token); the chart
        # renders no config of its own when this is set.
        configSecret: alertmanager-config

    grafana:
      image:
        tag: 13.2.2-distroless
        sha: 69a5d2d957ca0bba434c160dcd4f2d07de9d6c756a0ba10ae7f52b72ced1e4cc
      sidecar:
        image:
          tag: 2.11.2
          sha: 2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
      testFramework:
        enabled: false
      admin:
        existingSecret: grafana-admin
      # The VictoriaLogs datasource is a plugin Grafana fetches at start
      # (GF_PLUGINS_PREINSTALL_SYNC); the network policy grants this pod
      # grafana.com and its download bucket for exactly that.
      plugins:
        - victoriametrics-logs-datasource@0.32.0@https://grafana.com/api/plugins/victoriametrics-logs-datasource/versions/0.32.0/download
      # No internet from this pod; stop the update and telemetry calls that
      # would otherwise show up as policy drops in Hubble.
      grafana.ini:
        analytics:
          check_for_updates: false
          check_for_plugin_updates: false
          reporting_enabled: false
        news:
          news_feed_enabled: false
      service:
        type: LoadBalancer
        port: 3000
        annotations:
          lbipam.cilium.io/sharing-key: "lan-shared"
          lbipam.cilium.io/sharing-cross-namespace: "*"
          lbipam.cilium.io/ips: "192.168.1.120"

    kube-state-metrics:
      image:
        tag: v2.20.0
        sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
      # Flux readiness as metrics (gotk_resource_info): the controllers do not
      # export it themselves; kube-state-metrics reads the custom resources.
      rbac:
        extraRules:
          - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
            resources: [gitrepositories, helmrepositories, kustomizations, helmreleases]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: { group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, lastAppliedRevision]
              - groupVersionKind: { group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, history, "0", chartVersion]
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]
                      revision: [status, artifact, revision]
              - groupVersionKind: { group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository }
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                    labelsFromPath:
                      exported_namespace: [metadata, namespace]
                      ready: [status, conditions, "[type=Ready]", status]
                      suspended: [spec, suspend]

    # node-exporter needs hostPID and hostPath, so it lives in its own privileged
    # namespace (core/monitoring/node-exporter) instead of this baseline one.
    prometheus-node-exporter:
      enabled: false

    # The apiserver's /metrics re-exports kubelet_volume_stats_* under
    # namespace=default, doubling every PVC series; the kubelet scrape is the
    # real source. Lists do not merge, so the endpoint is restated whole.
    kubeApiServer:
      vmScrape:
        spec:
          endpoints:
            - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
              port: https
              scheme: https
              tlsConfig:
                caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                serverName: kubernetes
              metricRelabelConfigs:
                - action: drop
                  source_labels: [__name__]
                  regex: kubelet_volume_stats_.*

    # k3s binds the scheduler, controller-manager and etcd metrics to localhost
    # on the server nodes; scraping them would be three permanently-down targets.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false

    # Scrape objects for things in `core` live here rather than beside them:
    # Flux dry-runs a Kustomization as a whole, so a VM custom resource in the
    # tree fails until this release has installed its CRDs. Helm orders them.
    extraObjects:
      # The scrape the chart would have generated for its bundled node-exporter,
      # pointed at core/monitoring/node-exporter instead.
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMServiceScrape
        metadata:
          name: node-exporter
          namespace: node-exporter
        spec:
          jobLabel: jobLabel
          selector:
            matchLabels:
              app.kubernetes.io/name: prometheus-node-exporter
              app.kubernetes.io/instance: node-exporter
          endpoints:
            - port: metrics
              metricRelabelConfigs:
                - action: drop
                  source_labels: [mountpoint]
                  regex: /var/lib/kubelet/pods.+
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMPodScrape
        metadata:
          name: cert-manager
          namespace: cert-manager
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/instance: cert-manager
          podMetricsEndpoints:
            - port: http-metrics
      # Cilium, its operator and Hubble serve metrics on the host network; the
      # node firewall opens 9962/9963/9965 (nixos SPEC/cilium-metrics.md) and
      # kube-system sits outside the default-deny baseline.
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMPodScrape
        metadata:
          name: cilium-agent
          namespace: kube-system
        spec:
          selector:
            matchLabels:
              k8s-app: cilium
          podMetricsEndpoints:
            - port: prometheus
            - port: hubble-metrics
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMPodScrape
        metadata:
          name: cilium-operator
          namespace: kube-system
        spec:
          selector:
            matchLabels:
              io.cilium/app: operator
          podMetricsEndpoints:
            - port: prometheus
      # flux-system's stock allow-scraping NetworkPolicy already admits any
      # namespace on 8080, so no policy change is needed there.
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMPodScrape
        metadata:
          name: flux
          namespace: flux-system
        spec:
          selector:
            matchLabels:
              app.kubernetes.io/part-of: flux
          podMetricsEndpoints:
            - port: http-prom
