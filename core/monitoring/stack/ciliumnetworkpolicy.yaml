# One policy per pod, so each grant sits next to the pod it applies to. The
# baseline CCNP already allows kubelet/health probes in and L4 DNS out.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vm-operator
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-metrics-operator
  ingress:
    # kube-apiserver calls the validating webhook.
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "9443", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmagent
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  ingress:
    # vmagent scrapes its own metrics.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: "8429", protocol: TCP }]
  egress:
    # Scrape targets live in every namespace, on every node (kubelet, cilium,
    # node-exporter run hostNetwork) and behind the apiserver. `cluster` covers
    # all of them; each target's own policy decides whether vmagent gets in.
    - toEntities: [cluster]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmsingle
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmsingle
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
        - matchLabels:
            app.kubernetes.io/name: vmalert
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports: [{ port: "8428", protocol: TCP }]
  egress:
    # vmsingle proxies its /vmalert UI pages to vmalert.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalert
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vlsingle
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vlsingle
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vlagent
            k8s:io.kubernetes.pod.namespace: node-exporter
        - matchLabels:
            app.kubernetes.io/name: grafana
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: "9428", protocol: TCP }]
  egress:
    # vlsingle proxies its /vmalert UI pages to vmalert, like vmsingle.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalert
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalert
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
        - matchLabels:
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
    # config-reloader sidecar metrics.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: "8435", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports: [{ port: "8428", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports: [{ port: "9093", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vmalertmanager
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vmalertmanager
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalert
        - matchLabels:
            app.kubernetes.io/name: vmagent
        - matchLabels:
            app.kubernetes.io/name: grafana
      toPorts:
        - ports: [{ port: "9093", protocol: TCP }]
    # config-reloader sidecar metrics.
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: "8435", protocol: TCP }]
  egress:
    # The config-reloader init container fetches the Alertmanager config Secret.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEndpoints:
        - matchLabels: { app: ntfy, k8s:io.kubernetes.pod.namespace: ntfy }
      toPorts:
        - ports: [{ port: "80", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  ingress:
    # blackbox probes /api/health (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus-blackbox-exporter
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
    # LAN clients arrive through the shared LoadBalancer VIP, SNATed to the
    # node that answered the ARP when it is not the one hosting the pod.
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: "3000", protocol: TCP }]
  egress:
    # The dashboard and datasource sidecars watch ConfigMaps.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmsingle
      toPorts:
        - ports: [{ port: "8428", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmalertmanager
      toPorts:
        - ports: [{ port: "9093", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vlsingle
      toPorts:
        - ports: [{ port: "9428", protocol: TCP }]
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    # The VictoriaLogs datasource plugin, fetched at start: grafana.com answers
    # the API call and redirects the download to its bucket.
    - toFQDNs:
        - matchName: "grafana.com"
        - matchName: "storage.googleapis.com"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kube-state-metrics
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
  ingress:
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dashboard-sync-job
  namespace: monitoring
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: syncJob
  egress:
    # Writes the fetched dashboards into ConfigMaps.
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    # The bundled dashboards are fetched from GitHub at install and upgrade. The
    # only pod in this namespace allowed to reach the internet, and only there.
    - toFQDNs:
        - matchName: "raw.githubusercontent.com"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
