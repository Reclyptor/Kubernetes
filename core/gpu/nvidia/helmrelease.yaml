apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nvidia-device-plugin
  namespace: kube-system
spec:
  releaseName: nvidia-device-plugin
  chart:
    spec:
      chart: nvidia-device-plugin
      version: 0.17.0
      sourceRef:
        kind: HelmRepository
        name: nvidia
        namespace: flux-system
  interval: 10m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    runtimeClassName: nvidia
    # One key feeds the plugin and mps containers and the mps-mounts init; the
    # config-manager sidecars have none.
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
    config:
      map:
        default: |-
          version: v1
        mps: |-
          version: v1
          sharing:
            mps:
              resources:
                - name: nvidia.com/gpu
                  replicas: 2
