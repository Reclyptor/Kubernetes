apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  ingress:
    # kube-apiserver calls the admission webhook.
    - fromEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "10250", protocol: TCP }]
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    # ACME directory/orders (Let's Encrypt) and the Cloudflare DNS API.
    - toFQDNs:
        - matchName: "acme-v02.api.letsencrypt.org"
        - matchName: "acme-staging-v02.api.letsencrypt.org"
        - matchName: "api.cloudflare.com"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    # DNS-01 propagation self-check against the public recursive resolvers
    # configured on the controller (1.1.1.1 / 1.0.0.1).
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "53", protocol: UDP }
            - { port: "53", protocol: TCP }
