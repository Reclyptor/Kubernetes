apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-dxp6800
  namespace: democratic-csi
spec:
  interval: 10m
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: api-secret-dxp6800
      valuesKey: apiKey
      targetPath: driver.config.httpConnection.apiKey
    - kind: Secret
      name: ssh-secret-dxp6800
      valuesKey: id_rsa
      targetPath: driver.config.sshConnection.privateKey
  values:
    csiDriver:
      name: "org.democratic-csi.iscsi-dxp6800"
    # Two replicas because the controller sits on the critical path for every
    # volume it owns: a drained node's pods cannot detach and re-attach their
    # iSCSI volumes without it. At one replica the controller can be scheduled
    # on the very node being drained, which deadlocks the drain against itself.
    # The four CSI sidecars already run --leader-election, so the second replica
    # is a warm standby and only the leader issues TrueNAS API calls.
    controller:
      replicaCount: 2
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: democratic-csi
                  app.kubernetes.io/instance: democratic-csi-dxp6800
                  app.kubernetes.io/csi-role: controller
                  app.kubernetes.io/component: controller-linux
              topologyKey: kubernetes.io/hostname
    node:
      hostPID: true
      # The node plugin must reach every node that mounts a volume, including
      # bytheon, which carries nvidia.com/gpu=true:NoSchedule to reserve the GPU
      # box. Without this the DaemonSet silently stops being scheduled there on
      # the next reboot or chart upgrade and volumes fail to mount.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    storageClasses:
      - name: iscsi-ephemeral-dxp6800
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
          csi.storage.k8s.io/node-stage-secret-name: chap-secret-dxp6800
          csi.storage.k8s.io/node-stage-secret-namespace: democratic-csi
          csi.storage.k8s.io/node-publish-secret-name: chap-secret-dxp6800
          csi.storage.k8s.io/node-publish-secret-namespace: democratic-csi
      - name: iscsi-persistent-dxp6800
        defaultClass: false
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
          csi.storage.k8s.io/node-stage-secret-name: chap-secret-dxp6800
          csi.storage.k8s.io/node-stage-secret-namespace: democratic-csi
          csi.storage.k8s.io/node-publish-secret-name: chap-secret-dxp6800
          csi.storage.k8s.io/node-publish-secret-namespace: democratic-csi
    driver:
      config:
        driver: freenas-iscsi
        httpConnection:
          protocol: https
          host: "192.168.1.2"
          port: 443
          allowInsecure: true
        sshConnection:
          host: "192.168.1.2"
          port: 22
          username: "truenas_admin"
        zfs:
          datasetParentName: "quantum/kubernetes/volumes"
          detachedSnapshotsDatasetParentName: "quantum/kubernetes/snapshots"
          zvolBlocksize: "16K"
          zvolCompression: "lz4"
          cli:
            sudoEnabled: true
            paths:
              zfs: /usr/sbin/zfs
              zpool: /usr/sbin/zpool
              sudo: /usr/bin/sudo
              chroot: /usr/sbin/chroot
        iscsi:
          targetPortal: "192.168.1.2:3260"
          iqnBase: "iqn.2005-10.org.freenas.ctl"
          namePrefix: "k8s-dxp6800-"
          targetGroups:
            - targetGroupPortalGroup: 1    # from Shares » Block (iSCSI) » Portals
              targetGroupInitiatorGroup: 2 # from Shares » Block (iSCSI) » Initiators — the allow-all group is id 2 on this box
              targetGroupAuthType: CHAP    # or CHAP / CHAP Mutual if you use auth
              targetGroupAuthGroup: 1      # only if using CHAP

