apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: democratic-csi
  namespace: democratic-csi
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: democratic-csi
  egress:
    # host too: a pod balanced to its own control-plane node's apiserver sees
    # it as host, not kube-apiserver, and would fail one connection in three.
    - toEntities: [kube-apiserver, host]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
    - toCIDR:
        - 192.168.1.2/32
        - 192.168.1.3/32
        - 192.168.1.4/32
      toPorts:
        - ports:
            - { port: "443", protocol: TCP }
            - { port: "22", protocol: TCP }
