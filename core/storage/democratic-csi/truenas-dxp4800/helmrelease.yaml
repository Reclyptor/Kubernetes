apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: democratic-csi-dxp4800
  namespace: democratic-csi
spec:
  interval: 10m
  chart:
    spec:
      chart: democratic-csi
      version: 0.15.0
      sourceRef:
        kind: HelmRepository
        name: democratic-csi
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  valuesFrom:
    - kind: Secret
      name: api-secret-dxp4800
      valuesKey: apiKey
      targetPath: driver.config.httpConnection.apiKey
    - kind: Secret
      name: ssh-secret-dxp4800
      valuesKey: id_rsa
      targetPath: driver.config.sshConnection.privateKey
  values:
    csiDriver:
      name: "org.democratic-csi.iscsi-dxp4800"
    # Two replicas because the controller sits on the critical path for every
    # volume it owns: a drained node's pods cannot detach and re-attach their
    # iSCSI volumes without it. At one replica the controller can be scheduled
    # on the very node being drained, which deadlocks the drain against itself.
    #
    # Each of the four CSI sidecars runs its own --leader-election, so leadership
    # is per sidecar rather than per pod: both replicas hold leases and share the
    # work, and neither is an idle standby. Both csi-driver containers also keep
    # their own SSH session to the NAS for liveness probes. That means a rollout
    # opens every replica's session at once, and the NAS sometimes drops one —
    # a burst of ssh2 protocol errors and sidecar restarts that clears itself
    # within ~20s once the connections settle. Expected; not a misconfiguration.
    controller:
      replicaCount: 2
      # Pinned by tag AND digest. The chart defaults this image to a bare :latest,
      # which was the original defect — every pod restart free to land on different
      # bits than its peers, and controller/node skew during a volume operation is
      # a far worse failure than any app-tier drift.
      #
      # v1.9.5 is a real upstream release, chosen over freezing the untagged rolling
      # build that was running before: that build matched no version tag at all, so
      # it could not be mapped to a changelog or a CVE list. The chart renders image
      # as "registry:tag" with no digest field, so the digest rides in the tag value;
      # the digest is what actually gets pulled and the tag is the honest label.
      #
      # GATE — this must have passed before this pin is considered good: create a
      # throwaway PVC on iscsi-ephemeral-fs6712x, confirm the new zvol comes back at
      # volblocksize=16384, destroy it. 16K provisioning is a measured property of
      # the old build, not a documented guarantee, so a version change invalidates
      # the evidence until it is re-measured. Anything but 16384 means roll back at
      # once, not investigate — the fleet is 16K and new volumes must not diverge.
      # Rollback is a plain revert of this commit, which restores
      # latest@sha256:944d0e65… — the bits that ran for weeks.
      driver:
        image:
          tag: "v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f"
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: democratic-csi
                  app.kubernetes.io/instance: democratic-csi-dxp4800
                  app.kubernetes.io/csi-role: controller
                  app.kubernetes.io/component: controller-linux
              topologyKey: kubernetes.io/hostname
    node:
      hostPID: true
      # Must match the controller digest exactly. The node plugin does the actual
      # iSCSI mounting, so controller/node skew is the failure this pin prevents.
      driver:
        image:
          tag: "v1.9.5@sha256:fc3b7d7ed3a616714139525075312758e23a5d425ffb539ad12c9bd20fb6001f"
      # The node plugin must reach every node that mounts a volume, including
      # bytheon, which carries nvidia.com/gpu=true:NoSchedule to reserve the GPU
      # box. Without this the DaemonSet silently stops being scheduled there on
      # the next reboot or chart upgrade and volumes fail to mount.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
    storageClasses:
      - name: iscsi-ephemeral-dxp4800
        defaultClass: false
        reclaimPolicy: Delete
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
          csi.storage.k8s.io/node-stage-secret-name: chap-secret-dxp4800
          csi.storage.k8s.io/node-stage-secret-namespace: democratic-csi
          csi.storage.k8s.io/node-publish-secret-name: chap-secret-dxp4800
          csi.storage.k8s.io/node-publish-secret-namespace: democratic-csi
      - name: iscsi-persistent-dxp4800
        defaultClass: false
        reclaimPolicy: Retain
        volumeBindingMode: Immediate
        allowVolumeExpansion: true
        parameters:
          fsType: ext4
          csi.storage.k8s.io/node-stage-secret-name: chap-secret-dxp4800
          csi.storage.k8s.io/node-stage-secret-namespace: democratic-csi
          csi.storage.k8s.io/node-publish-secret-name: chap-secret-dxp4800
          csi.storage.k8s.io/node-publish-secret-namespace: democratic-csi
    driver:
      config:
        driver: freenas-iscsi
        httpConnection:
          protocol: https
          host: "192.168.1.3"
          port: 443
          allowInsecure: true
        sshConnection:
          host: "192.168.1.3"
          port: 22
          username: "truenas_admin"
        zfs:
          datasetParentName: "qubit/kubernetes/volumes"
          detachedSnapshotsDatasetParentName: "qubit/kubernetes/snapshots"
          zvolBlocksize: "16K"
          zvolCompression: "lz4"
          cli:
            sudoEnabled: true
            paths:
              zfs: /usr/sbin/zfs
              zpool: /usr/sbin/zpool
              sudo: /usr/bin/sudo
              chroot: /usr/sbin/chroot
        iscsi:
          targetPortal: "192.168.1.3:3260"
          iqnBase: "iqn.2005-10.org.freenas.ctl"
          namePrefix: "k8s-dxp4800-"
          targetGroups:
            - targetGroupPortalGroup: 1    # from Shares » Block (iSCSI) » Portals
              targetGroupInitiatorGroup: 1 # from Shares » Block (iSCSI) » Initiators
              targetGroupAuthType: CHAP    # or CHAP / CHAP Mutual if you use auth
              targetGroupAuthGroup: 1      # only if using CHAP

