apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: snapshot-controller
  namespace: democratic-csi
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: snapshot-controller
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{ port: "6443", protocol: TCP }]
