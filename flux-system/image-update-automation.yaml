# Writes ImagePolicy winners back to this repository: scans for
# `# {"$imagepolicy": ...}` markers, updates the tags, commits to master.
# The flux-system deploy key has write access (verified read_only: false).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: flux@reclyptor.com
        name: Flux
      # Subject-only per repo convention. Renders as
      #   "Deployed the Latest Makotogotchi Image: 1de08a1"
      # deriving the app name and short hash from the image ref
      # (ghcr.io/reclyptor/<app>:<timestamp>-<shorthash>), so it stays
      # correct for every app this automation serves. Sprig functions are
      # available per the ImageUpdateAutomation v1 docs; the "; " separator
      # covers the rare commit containing several apps' updates at once.
      messageTemplate: >-
        {{- $first := true -}}
        {{- range .Changed.Changes -}}
        {{- if not $first }}; {{ end -}}
        {{- $first = false -}}
        Deployed the Latest {{ .NewValue | splitList ":" | first | splitList "/" | last | title }} Image: {{ .NewValue | splitList ":" | last | splitList "-" | last }}
        {{- end -}}
    push:
      branch: master
  update:
    path: ./apps
    strategy: Setters
