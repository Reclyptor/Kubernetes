# Writes ImagePolicy winners back to this repository: scans for
# `# {"$imagepolicy": ...}` markers, updates the tags, commits to master.
# The flux-system deploy key has write access (verified read_only: false).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 5m0s
  sourceRef:
    kind: GitRepository
    name: flux-system
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        email: flux@reclyptor.com
        name: Flux
      # Subject-only per repo convention: the diff carries the old → new
      # image refs, and the Flux author line carries provenance. Deliberately
      # app-agnostic — this one automation serves every app under ./apps.
      messageTemplate: "Deployed the Latest Images"
    push:
      branch: master
  update:
    path: ./apps
    strategy: Setters
