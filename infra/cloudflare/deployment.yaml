apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflare
  namespace: cloudflare
spec:
  # cloudflared registers each replica as its own connection to the same
  # tunnel and Cloudflare load-balances across them, so a second replica is
  # real redundancy rather than contention. Default RollingUpdate at 2 replicas
  # gives maxUnavailable 0 / maxSurge 1 — the tunnel never drops during a roll.
  replicas: 2
  selector:
    matchLabels:
      app: cloudflare
  template:
    metadata:
      labels:
        app: cloudflare
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # Two replicas on one node would survive a pod failure but not a node
      # failure, which is most of the point. Preferred, not required: one
      # replica running beats two Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: cloudflare
                topologyKey: kubernetes.io/hostname
      containers:
      - name: cloudflared
        image: docker.io/cloudflare/cloudflared:2026.9.1@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
        imagePullPolicy: IfNotPresent
        args:
          - tunnel
          - --config
          - /etc/cloudflared/config/config.yaml
          - run
        env:
        - name: TUNNEL_TOKEN
          valueFrom:
            secretKeyRef:
              name: tunnel-token
              key: token
        # /ready reports whether the tunnel has live edge connections. As a
        # readiness gate it keeps a replica out of rotation until it is really
        # serving; as a liveness check one missed poll is not evidence of a
        # wedged process, so it takes three.
        readinessProbe:
          httpGet:
            path: /ready
            port: 2000
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /ready
            port: 2000
          failureThreshold: 3
          initialDelaySeconds: 10
          periodSeconds: 10
        ports:
        - containerPort: 2000
          name: metrics
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ALL]
        volumeMounts:
        - name: config
          mountPath: /etc/cloudflared/config
          readOnly: true
        - name: tmp
          mountPath: /tmp
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: cloudflare-config
          items:
          - key: config.yaml
            path: config.yaml
      - name: tmp
        emptyDir: {}

