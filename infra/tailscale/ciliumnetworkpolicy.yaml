apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tailscale
  namespace: tailscale
spec:
  endpointSelector:
    matchLabels:
      app: tailscale
  ingress:
    # Remote family WireGuard arrives via the playit-published UDP endpoint.
    - fromEndpoints:
        - matchLabels:
            app: playit
            k8s:io.kubernetes.pod.namespace: playit
      toPorts:
        - ports: [{ port: "41641", protocol: UDP }]
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    # Control + DERP relay reach headscale over its public URL, which resolves
    # to the playit edge (headscale.reclyptor.com:1587).
    - toFQDNs:
        - matchName: "headscale.reclyptor.com"
      toPorts:
        - ports: [{ port: "1587", protocol: TCP }]
    # WireGuard/STUN to remote peers and relays over arbitrary UDP ports.
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "1", endPort: 65535, protocol: UDP }]
    # Defense-in-depth: the advertised route covers all of .120, but the
    # router may forward ONLY to the two media services — nothing else.
    - toEndpoints:
        - matchLabels:
            app: jellyfin
            k8s:io.kubernetes.pod.namespace: jellyfin
      toPorts:
        - ports: [{ port: "8096", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: emby
            k8s:io.kubernetes.pod.namespace: emby
      toPorts:
        - ports: [{ port: "8096", protocol: TCP }]
