apiVersion: v1
kind: Service
metadata:
  name: tailscale
  namespace: tailscale
  annotations:
    lbipam.cilium.io/sharing-key: "lan-shared"
    lbipam.cilium.io/sharing-cross-namespace: "*"
    lbipam.cilium.io/ips: "192.168.1.120"
spec:
  type: LoadBalancer
  selector:
    app: tailscale
  ports:
    - name: wireguard
      port: 41641
      protocol: UDP
