apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seaweedfs
  namespace: seaweedfs
spec:
  endpointSelector:
    matchLabels:
      app: seaweedfs
  ingress:
    # vmagent scrapes seaweedfs's metrics (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9327", protocol: TCP }]
    - fromEntities: [world, remote-node]
      toPorts:
        - ports:
            - { port: "8333", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            app: seaweedfs
      toPorts:
        - ports:
            - { port: "8333", protocol: TCP }
            - { port: "8888", protocol: TCP }
            - { port: "9333", protocol: TCP }
