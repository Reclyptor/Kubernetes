apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: kestra
  namespace: kestra
spec:
  endpointSelector:
    matchLabels:
      app: kestra
  ingress:
    # vmagent scrapes the management port's /prometheus (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "8081", protocol: TCP }]
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "8080", protocol: TCP }]
  egress:
    - toEndpoints:
        - matchLabels:
            app: mysql
            k8s:io.kubernetes.pod.namespace: mysql
      toPorts:
        - ports: [{ port: "3306", protocol: TCP }]
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
