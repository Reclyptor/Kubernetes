apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mongodb
  namespace: mongodb
spec:
  endpointSelector:
    matchLabels:
      app: mongodb
  ingress:
    # vmagent scrapes the mongodb exporter sidecar (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9216", protocol: TCP }]
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "27017", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app: makotogotchi
            k8s:io.kubernetes.pod.namespace: makotogotchi
      toPorts:
        - ports: [{ port: "27017", protocol: TCP }]
