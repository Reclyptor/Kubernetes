apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headscale
  namespace: headscale
spec:
  endpointSelector:
    matchLabels:
      app: headscale
  ingress:
    # blackbox probes /health (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus-blackbox-exporter
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "8443", protocol: TCP }]
    # vmagent scrapes headscale's metrics (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9090", protocol: TCP }]
    # LAN clients register/coordinate directly over the shared VIP (TLS).
    - fromEntities: [world, remote-node]
      toPorts:
        - ports:
            - { port: "8443", protocol: TCP }
            - { port: "3478", protocol: UDP }
    # Remote family: playit forwards the control/DERP (TCP 8443) and STUN
    # (UDP 3478) tunnels to the pod.
    - fromEndpoints:
        - matchLabels:
            app: playit
            k8s:io.kubernetes.pod.namespace: playit
      toPorts:
        - ports:
            - { port: "8443", protocol: TCP }
            - { port: "3478", protocol: UDP }
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    # OIDC discovery/token/JWKS with Authentik at its public issuer.
    - toFQDNs:
        - matchName: "auth.reclyptor.com"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
