apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: headscale
  namespace: headscale
spec:
  serviceName: headscale
  replicas: 1
  selector:
    matchLabels:
      app: headscale
  template:
    metadata:
      labels:
        app: headscale
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: headscale
          image: headscale/headscale:latest
          imagePullPolicy: Always
          args:
            - serve
          ports:
            - name: https
              protocol: TCP
              containerPort: 8443
            - name: metrics
              protocol: TCP
              containerPort: 9090
            - name: grpc
              protocol: TCP
              containerPort: 50443
            - name: stun
              protocol: UDP
              containerPort: 3478
          volumeMounts:
            - name: config
              mountPath: /etc/headscale/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: config
              mountPath: /etc/headscale/policy.hujson
              subPath: policy.hujson
              readOnly: true
            - name: secrets
              mountPath: /etc/headscale/secrets
              readOnly: true
            - name: tls
              mountPath: /etc/headscale/tls
              readOnly: true
            - name: data
              mountPath: /var/lib/headscale
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          livenessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: headscale-config
            items:
              - key: config.yaml
                path: config.yaml
              - key: policy.hujson
                path: policy.hujson
        - name: secrets
          secret:
            secretName: headscale-oidc
            items:
              - key: OIDC_CLIENT_SECRET
                path: oidc_client_secret
        - name: tls
          secret:
            secretName: headscale-tls
        - name: tmp
          emptyDir: {}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 5Gi
