apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: mysql
  namespace: mysql
spec:
  endpointSelector:
    matchLabels:
      app: mysql
  ingress:
    # vmagent scrapes the mysql exporter sidecar (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9104", protocol: TCP }]
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "3306", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app: kestra
            k8s:io.kubernetes.pod.namespace: kestra
        - matchLabels:
            app: temporal
            k8s:io.kubernetes.pod.namespace: temporal
      toPorts:
        - ports: [{ port: "3306", protocol: TCP }]
