apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-media
  namespace: authentik
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: iscsi-persistent-fs6712x
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-templates
  namespace: authentik
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: iscsi-persistent-fs6712x
  resources:
    requests:
      storage: 1Gi
