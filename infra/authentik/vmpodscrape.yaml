# Only the server listens on the metrics port; the worker shares the app label.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: authentik
  namespace: authentik
spec:
  selector:
    matchLabels:
      app: authentik
      component: server
  podMetricsEndpoints:
    - port: metrics
