apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentik-server
  namespace: authentik
spec:
  # authentik is the SSO gate for everything public, so it must survive a
  # drain. Sessions and flow state live in redis and migrations take a postgres
  # advisory lock, so replicas share nothing local. maxUnavailable 0 keeps two
  # Ready replicas through a roll.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: authentik
      component: server
  template:
    metadata:
      labels:
        app: authentik
        component: server
    spec:
      automountServiceAccountToken: false
      priorityClassName: catastrophic
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Preferred, not required: one replica running beats one Pending.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: authentik
                    component: server
                topologyKey: kubernetes.io/hostname
      containers:
        - name: authentik
          image: docker.io/beryju/authentik:2025.2.4@sha256:36233579415aa2e2e52a6b0c45736cb871fe71460bfe0cf95d83f67528fb1182
          imagePullPolicy: IfNotPresent
          args: ["server"]
          envFrom:
            - secretRef:
                name: authentik-secret
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 9443
              name: https
            - containerPort: 9300
              name: metrics
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          # Gives endpoint removal time to reach cloudflared and ntfy-proxy
          # before the server stops accepting connections.
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          # Migrations wait on a postgres advisory lock, so a start can take
          # minutes behind another replica's migration. The startup probe holds
          # liveness off for up to 5 minutes, and readiness has no fixed delay.
          startupProbe:
            httpGet:
              path: /-/health/live/
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /-/health/ready/
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /-/health/live/
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          volumeMounts:
            - name: media
              mountPath: /media
      volumes:
        # Media is UI uploads only (icons, backgrounds), and none exist. It is
        # deliberately not persisted, so do not upload through the admin UI.
        # Shared media would mean AUTHENTIK_STORAGE__MEDIA__BACKEND=s3.
        - name: media
          emptyDir:
            sizeLimit: 64Mi
