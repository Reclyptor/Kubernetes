apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app: authentik
  ingress:
    # blackbox probes /-/health/ready/ (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus-blackbox-exporter
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9000", protocol: TCP }]
    # vmagent scrapes the server's metrics; the worker shares the label but does not listen (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9300", protocol: TCP }]
    - fromEntities: [world, remote-node]
      toPorts:
        - ports:
            - { port: "9000", protocol: TCP }
            - { port: "9443", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            app: cloudflare
            k8s:io.kubernetes.pod.namespace: cloudflare
        - matchLabels:
            app: ntfy-proxy
            k8s:io.kubernetes.pod.namespace: ntfy
      toPorts:
        - ports:
            - { port: "9000", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            app: postgres
            k8s:io.kubernetes.pod.namespace: postgres
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: redis
            k8s:io.kubernetes.pod.namespace: redis
      toPorts:
        - ports: [{ port: "6379", protocol: TCP }]
