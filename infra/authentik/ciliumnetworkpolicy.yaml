apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app: authentik
  ingress:
    - fromEntities: [world, remote-node]
      toPorts:
        - ports:
            - { port: "9000", protocol: TCP }
            - { port: "9443", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            app: cloudflare
            k8s:io.kubernetes.pod.namespace: cloudflare
        - matchLabels:
            app: ntfy-proxy
            k8s:io.kubernetes.pod.namespace: ntfy
        # The LDAP outpost polls the server API for its configuration. Its own
        # policy already permits the egress; without the matching ingress here
        # Cilium drops the connection and the outpost never becomes ready.
        - matchLabels:
            app: authentik-ldap
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - { port: "9000", protocol: TCP }
    - fromEndpoints:
        - matchLabels:
            app: sera
            k8s:io.kubernetes.pod.namespace: sera
        - matchLabels:
            app: seraui
            k8s:io.kubernetes.pod.namespace: seraui
      toPorts:
        - ports:
            - { port: "9000", protocol: TCP }
            - { port: "9443", protocol: TCP }
  egress:
    - toEndpoints:
        - matchLabels:
            app: postgres
            k8s:io.kubernetes.pod.namespace: postgres
      toPorts:
        - ports: [{ port: "5432", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: redis
            k8s:io.kubernetes.pod.namespace: redis
      toPorts:
        - ports: [{ port: "6379", protocol: TCP }]
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-ldap
  namespace: authentik
spec:
  endpointSelector:
    matchLabels:
      app: authentik-ldap
  ingress:
    # Emby binds to the LDAP outpost for authentication.
    - fromEndpoints:
        - matchLabels:
            app: emby
            k8s:io.kubernetes.pod.namespace: emby
      toPorts:
        - ports:
            - { port: "3389", protocol: TCP }
            - { port: "6636", protocol: TCP }
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    # Outpost <-> Authentik core API (in-cluster).
    - toEndpoints:
        - matchLabels:
            app: authentik
            component: server
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports: [{ port: "9000", protocol: TCP }]
