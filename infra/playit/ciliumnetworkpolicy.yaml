apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: playit
  namespace: playit
spec:
  endpointSelector:
    matchLabels:
      app: playit
  egress:
    # DNS via the node-local proxy so FQDN policy can resolve api.playit.gg
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    # playit's edge is a large, distributed, unpublished fleet of tunnel servers:
    # the control API rides Cloudflare, and each connection is claimed on a
    # server-chosen TCP/UDP port across several netblocks (e.g. 69.9.176.0/20,
    # 209.25.140.0/24). There is no stable allowlist to pin, so this relay gets
    # broad egress to the internet. Containment lives below — it may only
    # FORWARD into the cluster to the explicit game/tailnet services.
    - toEntities: [world]
      toPorts:
        - ports:
            - { port: "1", endPort: 65535, protocol: TCP }
            - { port: "1", endPort: 65535, protocol: UDP }
    # forward tunneled player traffic to the game servers only
    - toEndpoints:
        - matchLabels:
            app: minecraft
            k8s:io.kubernetes.pod.namespace: minecraft
      toPorts:
        - ports: [{ port: "25565", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: factorio
            k8s:io.kubernetes.pod.namespace: factorio
      toPorts:
        - ports: [{ port: "34197", protocol: UDP }]
    - toEndpoints:
        - matchLabels:
            app: palworld
            k8s:io.kubernetes.pod.namespace: palworld
      toPorts:
        - ports: [{ port: "8211", protocol: UDP }]
    # tailnet data path: publish Headscale's embedded DERP/STUN and the
    # subnet router's WireGuard endpoint
    - toEndpoints:
        - matchLabels:
            app: headscale
            k8s:io.kubernetes.pod.namespace: headscale
      toPorts:
        - ports:
            - { port: "8443", protocol: TCP }
            - { port: "3478", protocol: UDP }
    - toEndpoints:
        - matchLabels:
            app: tailscale
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports: [{ port: "41641", protocol: UDP }]
