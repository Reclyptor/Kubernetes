apiVersion: apps/v1
kind: Deployment
metadata:
  name: playit
  namespace: playit
spec:
  strategy:
    type: Recreate
  replicas: 1
  selector:
    matchLabels:
      app: playit
  template:
    metadata:
      labels:
        app: playit
    spec:
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - fluxeon
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: playit
          image: ghcr.io/playit-cloud/playit-agent:1.0.10
          imagePullPolicy: IfNotPresent
          # playitd 1.0 is a daemon: it binds an IPC socket (must land on the
          # writable /tmp under a read-only root) and reads its secret from a
          # file rather than the old SECRET_KEY env var.
          command: ["playitd"]
          args:
            - "--platform-docker"
            - "--socket-path"
            - "/tmp/playit.sock"
            - "--secret-path"
            - "/etc/playit/SECRET_KEY"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: secret
              mountPath: /etc/playit
              readOnly: true
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: secret
          secret:
            secretName: playit-secret
