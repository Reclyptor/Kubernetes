apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: redis
  namespace: redis
spec:
  endpointSelector:
    matchLabels:
      app: redis
  ingress:
    # vmagent scrapes the redis exporter sidecar (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: vmagent
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "9121", protocol: TCP }]
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "6379", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app: authentik
            k8s:io.kubernetes.pod.namespace: authentik
        - matchLabels:
            app: makotogotchi
            k8s:io.kubernetes.pod.namespace: makotogotchi
      toPorts:
        - ports: [{ port: "6379", protocol: TCP }]
