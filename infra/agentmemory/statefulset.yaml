apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agentmemory
  namespace: agentmemory
spec:
  serviceName: agentmemory
  replicas: 1
  selector:
    matchLabels:
      app: agentmemory
  template:
    metadata:
      labels:
        app: agentmemory
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
      containers:
        - name: engine
          image: iiidev/iii:0.22.1
          imagePullPolicy: IfNotPresent
          args: ["--config", "/app/config.yaml", "--no-update-check"]
          env:
            - name: III_TELEMETRY_ENABLED
              value: "false"
            # Caps glibc's per-thread malloc arenas, which otherwise inflate RSS
            # well past what the store holds.
            - name: MALLOC_ARENA_MAX
              value: "2"
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
          ports:
            - containerPort: 3111
              name: rest
            - containerPort: 3112
              name: stream
            - containerPort: 49134
              name: worker
          volumeMounts:
            - name: data
              mountPath: /data
            - name: engine-config
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          livenessProbe:
            httpGet:
              path: /agentmemory/livez
              port: 3111
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: 1Gi
              cpu: 100m
            limits:
              memory: 3Gi
              cpu: "1"
        - name: app
          # Built by Reclyptor/AgentMemory from upstream commit df3d4a8
          # (v0.9.30 plus the #745 session-finalize fix), with the local
          # embedding model baked in.
          image: ghcr.io/reclyptor/agentmemory:0.9.30-df3d4a8
          imagePullPolicy: IfNotPresent
          command:
            - bash
            - -c
            - |
              until (exec 3<>/dev/tcp/127.0.0.1/49134) 2>/dev/null; do
                echo "waiting for iii engine on :49134..."
                sleep 2
              done
              mkdir -p "$HOME"
              exec agentmemory --no-engine
          env:
            - name: HOME
              value: /data/home
            # Node sizes its heap from the cgroup limit, which leaves ~1 GB:
            # too little for rebuilding the keyword index over the whole store
            # at boot.
            - name: NODE_OPTIONS
              value: --max-old-space-size=1536
            - name: III_REST_PORT
              value: "3111"
            - name: AGENTMEMORY_URL
              value: http://127.0.0.1:3111
            - name: AGENTMEMORY_EXPORT_ROOT
              value: /data/exports
            - name: SNAPSHOT_DIR
              value: /data/snapshots
            - name: STANDALONE_PERSIST_PATH
              value: /data/local.db
            - name: AGENTMEMORY_AUTO_COMPRESS
              value: "true"
            - name: EMBEDDING_PROVIDER
              value: local
            # Compression and summaries run on the in-cluster Qwen. agentmemory
            # appends /v1/chat/completions to the base URL itself.
            - name: OPENAI_BASE_URL
              value: http://vllm-api.vllm.svc.cluster.local:8000
            - name: OPENAI_MODEL
              value: Qwen3.8-27B-FP8
            # vLLM turns this into thinking off for Qwen, so a compression is a
            # short answer instead of a reasoning trace eating MAX_TOKENS.
            - name: OPENAI_REASONING_EFFORT
              value: none
            # The 60s default is shorter than a compression takes while vLLM's
            # slots are all busy; timeouts then trip agentmemory's circuit
            # breaker.
            - name: AGENTMEMORY_LLM_TIMEOUT_MS
              value: "240000"
            # Session summaries re-run on every Stop hook over the whole
            # session. The default 400 observations per chunk is a 100k–200k
            # token prompt, which stalls every other request on the two 3090s
            # for minutes. Small chunks prefill in seconds and stay
            # prefix-cache hits on the next re-run, since earlier chunks don't
            # change.
            - name: SUMMARIZE_CHUNK_SIZE
              value: "50"
            - name: SUMMARIZE_CHUNK_CONCURRENCY
              value: "2"
            # vLLM runs keyless, but agentmemory only picks the OpenAI provider
            # when this is non-empty. Not a secret.
            - name: OPENAI_API_KEY
              value: unused-vllm-checks-no-key
            - name: AGENTMEMORY_SECRET
              valueFrom:
                secretKeyRef:
                  name: agentmemory-secret
                  key: AGENTMEMORY_SECRET
            # One boot only: embed every stored document, not just those newer
            # than the last index save (SPEC/agentmemory-upgrade.md). Remove
            # once /agentmemory/status reports the backfill done.
            - name: AGENTMEMORY_VECTOR_BACKFILL
              value: all
            - name: AGENTMEMORY_VECTOR_BACKFILL_MAX
              value: "50000"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /agentmemory/livez
              port: 3111
            initialDelaySeconds: 25
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /agentmemory/livez
              port: 3111
            initialDelaySeconds: 240
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 3Gi
              cpu: "2"
      volumes:
        - name: engine-config
          configMap:
            name: agentmemory-engine-config
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 10Gi
