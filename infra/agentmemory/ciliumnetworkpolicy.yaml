apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentmemory
  namespace: agentmemory
spec:
  endpointSelector:
    matchLabels:
      app: agentmemory
  ingress:
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "3111", protocol: TCP }]
    # TEMPORARY: the compression backfill Job (compress-backfill.yaml) reads
    # the REST API and triggers mem::compress over the worker socket. Remove
    # with that file.
    - fromEndpoints:
        - matchLabels:
            app: agentmemory-compress-backfill
            k8s:io.kubernetes.pod.namespace: agentmemory
      toPorts:
        - ports:
            - { port: "3111", protocol: TCP }
            - { port: "49134", protocol: TCP }
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    - toFQDNs:
        - matchName: "registry.npmjs.org"
        # sharp's install script fetches its libvips binary from GitHub
        # releases, which redirect to the asset hosts.
        - matchName: "github.com"
        - matchName: "release-assets.githubusercontent.com"
        - matchName: "objects.githubusercontent.com"
        # The local embedding model downloads from Hugging Face on first use.
        # Its files redirect to CDN hosts several labels deep
        # (us.aws.cdn.hf.co); Cilium wildcards do not span dots.
        - matchName: "huggingface.co"
        - matchPattern: "*.hf.co"
        - matchPattern: "*.*.hf.co"
        - matchPattern: "*.*.*.hf.co"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEndpoints:
        - matchLabels:
            app: vllm
            k8s:io.kubernetes.pod.namespace: vllm
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
