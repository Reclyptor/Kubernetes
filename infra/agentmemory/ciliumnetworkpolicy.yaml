apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentmemory
  namespace: agentmemory
spec:
  endpointSelector:
    matchLabels:
      app: agentmemory
  ingress:
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "3111", protocol: TCP }]
    # TEMPORARY: the recovery backfill Job (compress-backfill.yaml) triggers
    # mem::compress over the worker socket. Remove with that file.
    - fromEndpoints:
        - matchLabels:
            app: agentmemory-compress-backfill
            k8s:io.kubernetes.pod.namespace: agentmemory
      toPorts:
        - ports: [{ port: "49134", protocol: TCP }]
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    - toEndpoints:
        - matchLabels:
            app: vllm
            k8s:io.kubernetes.pod.namespace: vllm
      toPorts:
        - ports: [{ port: "8000", protocol: TCP }]
