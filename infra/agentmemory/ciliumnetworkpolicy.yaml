apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agentmemory-claude
  namespace: agentmemory
spec:
  endpointSelector:
    matchLabels:
      app: agentmemory-claude
  ingress:
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "3111", protocol: TCP }]
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    - toFQDNs:
        - matchName: "api.anthropic.com"
        - matchName: "registry.npmjs.org"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
