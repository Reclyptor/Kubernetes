creation_rules:
  # NFS PVs: export paths reveal the NAS layout in a public repo, so only
  # `path` is encrypted. Flux rejects fully encrypted non-Secret files.
  - path_regex: (^|/)apps/[^/]+/pv\.yaml$
    encrypted_regex: ^path$
    age: age1yubikey1q2u7ajmktdc5e5ejq98qmrwha8xglt06k96zupqmh6e6qzfvh434s0wa5yy,age140jklplcfmptcv2q0jek2uee0aga2c2zd9c5p8jw5c8kyg9sef0sqwkh9k
  - path_regex: .*\.ya?ml$
    encrypted_regex: ^(data|stringData)$
    age: age1yubikey1q2u7ajmktdc5e5ejq98qmrwha8xglt06k96zupqmh6e6qzfvh434s0wa5yy,age140jklplcfmptcv2q0jek2uee0aga2c2zd9c5p8jw5c8kyg9sef0sqwkh9k
