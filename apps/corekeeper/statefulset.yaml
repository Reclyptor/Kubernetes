apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: corekeeper
  namespace: corekeeper
spec:
  serviceName: corekeeper-server
  replicas: 1
  selector:
    matchLabels:
      app: corekeeper
  template:
    metadata:
      labels:
        app: corekeeper
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - fluxeon
      # STOP_TIMEOUT (120s) plus the world flush on SIGTERM must fit in here.
      terminationGracePeriodSeconds: 180
      containers:
        - name: corekeeper
          # Direct-connect mode (PORT set): players join by IP:port through
          # the shared LAN IP or the playit tunnel, and the START message posts
          # the address to Discord. No Game ID is announced in this mode.
          image: ghcr.io/reclyptor/corekeeper:20260915053808-d414611 # {"$imagepolicy": "flux-system:corekeeper"}
          ports:
            - name: game
              containerPort: 27015
              protocol: UDP
            # The toolkit's read-only /metrics and /healthz (no scraper yet).
            - name: metrics
              containerPort: 9110
              protocol: TCP
          # DISCORD_WEBHOOK_URL, SERVER_ADDRESS
          envFrom:
            - secretRef:
                name: corekeeper-secret
          env:
            # ── GameOps: nightly backups kept 14 days; hourly update check; players warned in-game
            #    where the game can broadcast, otherwise the update waits for an empty server ──
            - name: TZ
              value: "America/Chicago"
            - name: SERVER_NAME
              value: "Core Keeper"
            - name: BACKUP_CRON
              value: "0 4 * * *"
            - name: BACKUP_RETAIN_DAYS
              value: "14"
            - name: UPDATE_CRON
              value: "0 * * * *"
            - name: UPDATE_WARN_MINUTES
              value: "15"
            - name: UPDATE_FORCE_AFTER_MINUTES
              value: "30"
            - name: STOP_TIMEOUT
              value: "120"
            # ── Core Keeper ──
            - name: WORLD_NAME
              value: "Core Keeper Server"
            - name: WORLD_INDEX
              value: "0"
            - name: WORLD_MODE
              value: "0"
            - name: MAX_PLAYERS
              value: "10"
            # Direct connect on UDP 27015; leaving PORT unset would mean Steam relay mode.
            - name: PORT
              value: "27015"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: "1000m"
              memory: "3Gi"
          # gameops health = process alive + GameInfo.txt present; the game port is
          # UDP and is not probed. The first start installs ~2 GB via SteamCMD,
          # hence the gate.
          startupProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: corekeeper-backups
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 10Gi
