apiVersion: v1
kind: Service
metadata:
  name: calibre-web
  namespace: library
  annotations:
    lbipam.cilium.io/sharing-key: "lan-shared"
    lbipam.cilium.io/sharing-cross-namespace: "*"
spec:
  type: LoadBalancer
  selector:
    app: calibre-web
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP

