apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: library-books
  namespace: library
spec:
  storageClassName: nfs-library-share
  accessModes: [ReadWriteMany]
  resources: {requests: {storage: 1Mi}}
  volumeName: library-books
