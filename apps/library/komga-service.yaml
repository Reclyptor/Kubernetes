apiVersion: v1
kind: Service
metadata:
  name: komga
  namespace: library
  annotations:
    lbipam.cilium.io/sharing-key: "lan-shared"
    lbipam.cilium.io/sharing-cross-namespace: "*"
spec:
  type: LoadBalancer
  selector:
    app: komga
  ports:
    - name: http
      port: 25600
      targetPort: 25600
      protocol: TCP

