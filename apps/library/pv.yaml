apiVersion: v1
kind: PersistentVolume
metadata:
  name: library-books
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-library-share
  nfs:
    server: 192.168.1.3
    path: /mnt/primary/literature/books
---
