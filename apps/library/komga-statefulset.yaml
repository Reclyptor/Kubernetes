# Comics lane. Two read-only library mounts; the libraries are configured in
# the Komga web UI on first run. Komga never writes to the buckets; its state
# lives in /config.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: komga
  namespace: library
spec:
  serviceName: komga
  replicas: 1
  selector:
    matchLabels:
      app: komga
  template:
    metadata:
      labels:
        app: komga
    spec:
      automountServiceAccountToken: false
      priorityClassName: marginal
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: komga
        image: ghcr.io/gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 25600
          protocol: TCP
        env:
        - name: TZ
          value: "America/Chicago"
        - name: SERVER_PORT
          value: "25600"
        - name: KOMGA_DATABASE_CHECK_LOCAL_FILESYSTEM
          value: "false"
        - name: KOMGA_TASKS_DB_CHECK_LOCAL_FILESYSTEM
          value: "false"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: manga
          mountPath: /manga
          readOnly: true
        - name: bucket3
          mountPath: /bucket3
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 25600
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 25600
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: config
        persistentVolumeClaim:
          claimName: library-config
      - name: manga
        persistentVolumeClaim:
          claimName: library-manga
      - name: bucket3
        persistentVolumeClaim:
          claimName: library-bucket3
