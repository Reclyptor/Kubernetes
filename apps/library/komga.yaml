# Comics lane: two libraries (configured in the Komga web UI on first run).
# Library mounts are read-only - Komga never writes to the buckets; its state
# lives in /config.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: komga
  namespace: library
spec:
  serviceName: komga
  replicas: 1
  selector:
    matchLabels:
      app: komga
  template:
    metadata:
      labels:
        app: komga
    spec:
      automountServiceAccountToken: false
      priorityClassName: marginal
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
      - name: ensure-dirs
        image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
        command: ["sh", "-c", "mkdir -p /share/_config/komga /share/manga /share/bucket3 && chmod 770 /share/_config/komga /share/manga /share/bucket3"]
        volumeMounts:
        - name: literature
          mountPath: /share
      containers:
      - name: komga
        image: ghcr.io/gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 25600
          protocol: TCP
        env:
        - name: TZ
          value: "America/Chicago"
        - name: SERVER_PORT
          value: "25600"
        volumeMounts:
        - name: literature
          mountPath: /config
          subPath: _config/komga
        - name: literature
          mountPath: /manga
          subPath: manga
          readOnly: true
        - name: literature
          mountPath: /bucket3
          subPath: bucket3
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 25600
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 25600
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
      volumes:
      - name: literature
        persistentVolumeClaim:
          claimName: library-literature
---
apiVersion: v1
kind: Service
metadata:
  name: komga
  namespace: library
  annotations:
    lbipam.cilium.io/sharing-key: "lan-shared"
    lbipam.cilium.io/sharing-cross-namespace: "*"
spec:
  type: LoadBalancer
  selector:
    app: komga
  ports:
    - name: http
      port: 25600
      targetPort: 25600
      protocol: TCP
