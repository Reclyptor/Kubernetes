apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    lbipam.cilium.io/sharing-key: "lan-shared"
    lbipam.cilium.io/sharing-cross-namespace: "*"
    lbipam.cilium.io/ips: "192.168.1.120"
spec:
  type: LoadBalancer
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8097
      targetPort: 8096
      protocol: TCP
    - name: https
      port: 8920
      protocol: TCP
    - name: discovery
      port: 7359
      protocol: UDP
    - name: dlna
      port: 1901
      targetPort: 1900
      protocol: UDP
