apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: jellyfin
  annotations:
    lbipam.cilium.io/ips: "192.168.1.121"
spec:
  type: LoadBalancer
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      protocol: TCP
    - name: https
      port: 8920
      protocol: TCP
    - name: discovery
      port: 7359
      protocol: UDP
    - name: dlna
      port: 1900
      protocol: UDP
