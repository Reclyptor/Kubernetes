apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: comfyui
  namespace: comfyui
spec:
  serviceName: comfyui-web
  replicas: 1
  selector:
    matchLabels:
      app: comfyui
  template:
    metadata:
      labels:
        app: comfyui
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bytheon
      initContainers:
        - name: seed-custom-nodes
          image: ghcr.io/reclyptor/comfyui:latest
          command:
            - sh
            - -c
            - |
              set -eu
              rm -rf /mnt/custom_nodes/lost+found
              # The image owns these; refresh every start so Dockerfile pin
              # bumps land. Manager-installed nodes alongside them are left
              # alone. ComfyUI-Manager is deliberately absent — it ships as a
              # pip package and must not live here.
              for node in ComfyUI-MultiGPU ComfyUI-GGUF; do
                rm -rf "/mnt/custom_nodes/$node"
                cp -a "/app/custom_nodes/$node" /mnt/custom_nodes/
              done
          volumeMounts:
            - name: custom-nodes
              mountPath: /mnt/custom_nodes
      containers:
        - name: comfyui
          image: ghcr.io/reclyptor/comfyui:latest
          imagePullPolicy: Always
          # Mirrors the image CMD plus --disable-dynamic-vram. DynamicVRAM
          # wraps large UNets in ModelPatcherDynamic, which overrides the
          # partially_load that ComfyUI-MultiGPU patches to split a model
          # across both cards. With it on, DisTorch2 allocation strings are
          # silently ignored and overflow streams from system RAM instead of
          # cuda:1. Turning it off is the only way to get real layer
          # distribution; models without a MultiGPU loader fall back to
          # estimate-based loading.
          command:
            - python3
            - main.py
            - --listen
            - 0.0.0.0
            - --port
            - "8188"
            - --enable-manager
            - --disable-dynamic-vram
          ports:
            - name: http
              containerPort: 8188
              protocol: TCP
          env:
            - name: TZ
              value: "America/Chicago"
          volumeMounts:
            - name: data
              mountPath: /app/models
            - name: output
              mountPath: /app/output
            - name: user
              mountPath: /app/user
            - name: input
              mountPath: /app/input
            - name: custom-nodes
              mountPath: /app/custom_nodes
            # Covers the whole cache dir, not just pip — ComfyUI-Manager
            # drives pip through uv, which needs a writable sibling. Mounting
            # a level deeper leaves .cache itself owned by root.
            - name: cache
              mountPath: /home/comfyui/.cache
          resources:
            requests:
              cpu: "1000m"
              memory: "8Gi"
              nvidia.com/gpu: "2"
            limits:
              nvidia.com/gpu: "2"
          livenessProbe:
            httpGet:
              path: /
              port: 8188
            initialDelaySeconds: 120
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 8188
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: cache
          emptyDir: {}
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            # volumeClaimTemplates is immutable, so growing this means
            # expanding the PVC directly then recreating the StatefulSet with
            # --cascade=orphan. Editing it against a live StatefulSet is
            # rejected and wedges Flux on every later reconcile.
            storage: 7Ti
    - metadata:
        name: output
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 50Gi
    - metadata:
        name: user
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: input
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 10Gi
    - metadata:
        name: custom-nodes
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 10Gi
