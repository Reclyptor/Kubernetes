apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: comfyui
  namespace: comfyui
spec:
  endpointSelector:
    matchLabels:
      app: comfyui
  ingress:
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "8188", protocol: TCP }]
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    - toFQDNs:
        - matchName: "github.com"
        - matchPattern: "*.github.com"
        - matchPattern: "*.githubusercontent.com"
        - matchName: "api.comfy.org"
        - matchName: "huggingface.co"
        - matchPattern: "*.huggingface.co"
        # Model downloads redirect to Xet CDN hosts several labels deep
        # (us.aws.cdn.hf.co, cas-bridge.xethub.hf.co). Cilium wildcards do not
        # span dots, so each depth needs its own pattern.
        - matchPattern: "*.hf.co"
        - matchPattern: "*.*.hf.co"
        - matchPattern: "*.*.*.hf.co"
        - matchName: "civitai.com"
        - matchName: "pypi.org"
        - matchName: "files.pythonhosted.org"
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
