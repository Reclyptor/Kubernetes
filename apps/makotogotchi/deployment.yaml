apiVersion: apps/v1
kind: Deployment
metadata:
  name: makotogotchi
  namespace: makotogotchi
spec:
  replicas: 1
  # Surge-then-terminate: the replacement pod must pass /ready (Mongo and
  # Redis reachable) before the old one stops, so deploys never drop the pet
  # offline. The overlap window is correct by construction — the Redis write
  # lock serializes both pods' writes and the leader lease keeps one ticker
  # (SPEC §3.3–3.4). Full blue-green machinery would add nothing: any
  # cutover severs SSE streams equally, and EventSource reconnects in
  # seconds while client-side projection keeps the meters moving.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: makotogotchi
  template:
    metadata:
      labels:
        app: makotogotchi
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
      - name: ghcr-secret
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - fluxeon
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
      - name: makotogotchi
        image: ghcr.io/reclyptor/makotogotchi:latest # {"$imagepolicy": "flux-system:makotogotchi"}
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        envFrom:
        - secretRef:
            name: makotogotchi-secret
        env:
        - name: TZ
          value: "America/Chicago"
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
