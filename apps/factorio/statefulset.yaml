apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: factorio
  namespace: factorio
spec:
  serviceName: factorio-server
  replicas: 1
  selector:
    matchLabels:
      app: factorio
  template:
    metadata:
      labels:
        app: factorio
    spec:
      automountServiceAccountToken: false
      # The image runs as uid/gid 845, matching the existing data volume.
      securityContext:
        runAsUser: 845
        runAsGroup: 845
        fsGroup: 845
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bytheon
      # STOP_TIMEOUT (120s) plus the save that precedes it must fit in here.
      terminationGracePeriodSeconds: 180
      containers:
        - name: factorio
          image: ghcr.io/reclyptor/factorio:20260915181215-a67207d # {"$imagepolicy": "flux-system:factorio"}
          ports:
            - name: game
              containerPort: 34197
              protocol: UDP
            # The toolkit's read-only /metrics and /healthz (no scraper yet).
            - name: metrics
              containerPort: 9110
              protocol: TCP
          # RCON_PASSWORD, DISCORD_WEBHOOK_URL, SERVER_ADDRESS
          envFrom:
            - secretRef:
                name: factorio-secret
          env:
            # ── GameOps: nightly backups kept 14 days; hourly update check; players warned in-game
            #    where the game can broadcast, otherwise the update waits for an empty server ──
            - name: TZ
              value: "America/Chicago"
            - name: SERVER_NAME
              value: "Factorio"
            - name: BACKUP_CRON
              value: "0 4 * * *"
            - name: BACKUP_RETAIN_DAYS
              value: "14"
            - name: UPDATE_CRON
              value: "0 * * * *"
            - name: UPDATE_WARN_MINUTES
              value: "15"
            - name: UPDATE_FORCE_AFTER_MINUTES
              value: "30"
            - name: STOP_TIMEOUT
              value: "120"
            # ── Factorio ──
            - name: PORT
              value: "34197"
            - name: SERVER_DESCRIPTION
              value: "Space Age"
            # factorio.com usernames. Both empty = an open server: no admins and
            # no whitelist gate (players are still verified by the auth server).
            - name: ADMINS
              value: ""
            - name: WHITELIST
              value: ""
            - name: MAX_PLAYERS
              value: "0"
            - name: AUTOSAVE_INTERVAL
              value: "5"
            - name: DLC_SPACE_AGE
              value: "true"
            - name: CHANNEL
              value: "stable"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: "1000m"
              memory: "2Gi"
          # gameops health = process alive + ready flag; the game port is UDP and is
          # not probed, and no RCON connection is opened, so the log stays quiet.
          startupProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: factorio-backups
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 10Gi
---
