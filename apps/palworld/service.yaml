apiVersion: v1
kind: Service
metadata:
  name: palworld-server
  namespace: palworld
  annotations:
    lbipam.cilium.io/sharing-key: "lan-shared"
    lbipam.cilium.io/sharing-cross-namespace: "*"
    lbipam.cilium.io/ips: "192.168.1.120"
spec:
  type: LoadBalancer
  selector:
    app: palworld
  ports:
    - name: game
      port: 8211
      protocol: UDP

---
apiVersion: v1
kind: Service
metadata:
  name: palworld-rcon
  namespace: palworld
spec:
  type: ClusterIP
  selector:
    app: palworld
  ports:
    - name: rcon
      port: 25575
      protocol: TCP
