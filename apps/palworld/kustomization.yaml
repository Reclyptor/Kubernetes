apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: palworld
resources:
  - namespace.yaml
  - secrets
  - statefulset.yaml
  - service.yaml
  - ciliumnetworkpolicy.yaml
configMapGenerator:
  # Titleless override of the image's discord.sh (mounted in the statefulset).
  - name: palworld-discord
    files:
      - discord.sh
