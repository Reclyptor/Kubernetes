            exec:
              command: ["gameops", "health"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
