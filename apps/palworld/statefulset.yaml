apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: palworld
  namespace: palworld
spec:
  serviceName: palworld-server
  replicas: 1
  selector:
    matchLabels:
      app: palworld
  template:
    metadata:
      labels:
        app: palworld
    spec:
      automountServiceAccountToken: false
      # The image runs as uid/gid 1000 throughout; SteamCMD installs the server
      # into the data volume. fsGroup keeps the volume writable by it.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # STOP_TIMEOUT (120s) plus the REST save that precedes it must fit in here.
      terminationGracePeriodSeconds: 180
      containers:
        - name: palworld
          image: ghcr.io/reclyptor/palworld:20260918120844-3681855 # {"$imagepolicy": "flux-system:palworld"}
          ports:
            - name: game
              containerPort: 8211
              protocol: UDP
            # The toolkit's read-only /metrics and /healthz (no scraper yet).
            - name: metrics
              containerPort: 9110
              protocol: TCP
          # ADMIN_PASSWORD, GAME_PASSWORD, DISCORD_WEBHOOK_URL, SERVER_ADDRESS
          envFrom:
            - secretRef:
                name: palworld-secret
          env:
            # ── GameOps: nightly backups kept 14 days; hourly update check; players warned in-game
            #    where the game can broadcast, otherwise the update waits for an empty server ──
            - name: TZ
              value: "America/Chicago"
            - name: SERVER_NAME
              value: "Palworld"
            - name: BACKUP_CRON
              value: "0 4 * * *"
            - name: BACKUP_RETAIN_DAYS
              value: "14"
            - name: UPDATE_CRON
              value: "0 * * * *"
            - name: UPDATE_WARN_MINUTES
              value: "15"
            - name: UPDATE_FORCE_AFTER_MINUTES
              value: "30"
            - name: STOP_TIMEOUT
              value: "120"
            # Only players arriving and leaving reach the channel; every other
            # event is omitted outright rather than posted unpinged. ALL covers
            # any event a future adapter invents, so one can never arrive here
            # by accident. Nothing silences JOIN and LEAVE.
            - name: DISCORD_DISABLED_EVENTS
              value: "ALL,!JOIN,!LEAVE"
            # ── Palworld ──
            - name: SERVER_DESCRIPTION
              value: ""
            - name: MAX_PLAYERS
              value: "16"
            # Private server — keep it off the community browser.
            - name: PUBLIC
              value: "false"
            - name: MULTITHREADING
              value: "true"
            - name: PORT
              value: "8211"
            - name: QUERY_PORT
              value: "27015"
            # REST API is loopback-only inside the pod: the toolkit saves, counts
            # players, announces and stops through it. No Service targets it.
            - name: REST_API_ENABLED
              value: "true"
            - name: REST_API_PORT
              value: "8212"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
          # gameops health = process alive + ready flag; the game port is UDP and is
          # not probed. The first start installs ~7 GB via SteamCMD, hence the gate.
          startupProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 120
          readinessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: palworld-backups
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 30Gi
