apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: palworld
  namespace: palworld
spec:
  serviceName: palworld-server
  replicas: 1
  selector:
    matchLabels:
      app: palworld
  template:
    metadata:
      labels:
        app: palworld
    spec:
      automountServiceAccountToken: false
      # This image starts as root to run SteamCMD (UPDATE_ON_BOOT) and fix
      # permissions, then drops the server process to PUID:PGID. It therefore
      # cannot run under a fixed non-root runAsUser like factorio/minecraft do;
      # baseline pod-security permits the root start. fsGroup keeps the iSCSI
      # volume writable by the dropped 1000:1000 user.
      securityContext:
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - fluxeon
      containers:
        - name: palworld
          image: thijsvanloef/palworld-server-docker:latest
          imagePullPolicy: Always
          ports:
            - name: game
              containerPort: 8211
              protocol: UDP
            - name: rcon
              containerPort: 25575
              protocol: TCP
          envFrom:
            - secretRef:
                name: palworld-secret
          env:
            # ── Runtime ──
            - name: TZ
              value: "America/Chicago"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            # Pull/verify the dedicated server via SteamCMD on every boot.
            - name: UPDATE_ON_BOOT
              value: "true"
            # In-container cron checks Steam for a new build, warns players over
            # RCON, saves, then updates and restarts the server process in place
            # (no pod restart). Requires RCON_ENABLED and UPDATE_ON_BOOT above.
            - name: AUTO_UPDATE_ENABLED
              value: "true"
            - name: AUTO_UPDATE_CRON_EXPRESSION
              value: "0 * * * *"
            - name: AUTO_UPDATE_WARN_MINUTES
              value: "15"
            - name: MULTITHREADING
              value: "true"
            # ── Server Identity ──
            - name: SERVER_NAME
              value: "Palworld Server"
            - name: SERVER_DESCRIPTION
              value: ""
            - name: PLAYERS
              value: "16"
            # Private, password-gated server — keep it off the community browser.
            - name: COMMUNITY
              value: "false"
            # ── Networking ──
            - name: PORT
              value: "8211"
            - name: QUERY_PORT
              value: "27015"
            # REST API — pod-internal only; the player-logging poller reads it on
            # 127.0.0.1:8212. No Service targets it and the CiliumNetworkPolicy
            # has no 8212 ingress rule (default-deny), so it stays unreachable.
            - name: REST_API_ENABLED
              value: "true"
            - name: REST_API_PORT
              value: "8212"
            # ── RCON (authenticates with ADMIN_PASSWORD) ──
            - name: RCON_ENABLED
              value: "true"
            - name: RCON_PORT
              value: "25575"
            # ── Discord (DISCORD_WEBHOOK_URL is injected from palworld-secret) ──
            # Announces player join/leave plus server start/stop, update, and
            # backup events. Player logging polls the REST API above every 5s;
            # each lifecycle notification defaults on once the webhook URL is set.
            - name: ENABLE_PLAYER_LOGGING
              value: "true"
            # Post as normal (non-@silent) messages so the channel notifies.
            - name: DISCORD_SUPPRESS_NOTIFICATIONS
              value: "false"
            # Plain-text message bodies (the mounted discord.sh override strips
            # the card/title/color). "player_name" is substituted at send time.
            # The boot update-check messages fire before the start phase, so they
            # describe the step rather than claim the server is online; the start
            # message announces go-live (the delay until it's joinable is trivial).
            - name: DISCORD_PLAYER_JOIN_MESSAGE
              value: "🟢 **player_name** joined the server."
            - name: DISCORD_PLAYER_LEAVE_MESSAGE
              value: "🔴 **player_name** left the server."
            - name: DISCORD_PRE_START_MESSAGE
              value: "🌴 The Palworld server is online — hop in!"
            - name: DISCORD_POST_SHUTDOWN_MESSAGE
              value: "💤 The Palworld server has shut down."
            - name: DISCORD_PRE_UPDATE_BOOT_MESSAGE
              value: "⏳ Checking for server updates…"
            - name: DISCORD_POST_UPDATE_BOOT_MESSAGE
              value: "🚀 Palworld server has been updated!"
            - name: DISCORD_PRE_BACKUP_MESSAGE
              value: "💾 Backing up the world…"
            - name: DISCORD_POST_BACKUP_MESSAGE
              value: "✅ World backup complete."
          volumeMounts:
            - name: data
              mountPath: /palworld
            # Plain-text override of the image's Discord notifier (see the
            # configMapGenerator in kustomization.yaml).
            - name: discord-override
              mountPath: /home/steam/server/discord.sh
              subPath: discord.sh
              readOnly: true
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
          # First boot downloads ~7GB via SteamCMD and generates the world, so
          # gate readiness/liveness behind a long startupProbe rather than a
          # fixed initialDelay: up to ~15 min before the tighter probes engage.
          startupProbe:
            tcpSocket:
              port: 25575
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: 25575
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 25575
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: discord-override
          configMap:
            name: palworld-discord
            defaultMode: 0755
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 30Gi
