apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lucebox-dflash
  namespace: lucebox
spec:
  serviceName: lucebox-dflash-api
  replicas: 0
  selector:
    matchLabels:
      app: lucebox-dflash
  template:
    metadata:
      labels:
        app: lucebox-dflash
    spec:
      automountServiceAccountToken: false
      runtimeClassName: nvidia
      # nvidia.com/gpu in the container resources already constrains this to a
      # GPU node — bytheon is the only one advertising the resource — so the
      # hostname pin bought nothing and would have blocked a second GPU node.
      # The toleration is what gets it past the taint reserving that box.
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: lucebox-dflash
          image: ghcr.io/reclyptor/lucebox-dflash:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: TZ
              value: "America/Chicago"
          volumeMounts:
            - name: models
              mountPath: /app/dflash/models
          resources:
            requests:
              cpu: "2000m"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              memory: "12Gi"
              nvidia.com/gpu: "1"
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: models
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 50Gi
