apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-books
  namespace: calibre
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-calibre-books
  volumeName: calibre-books-dxp4800
  resources:
    requests:
      storage: 1Mi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: calibre-ingest
  namespace: calibre
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-calibre-ingest
  volumeName: calibre-ingest-dxp4800
  resources:
    requests:
      storage: 1Mi
