# Calibre-Web-Automated, the maintained fork, with Calibre bundled. Its s6 init
# must start as root and drops to its app user (1000) itself. fsGroup makes the
# fresh config volume writable by that user. The library lives on NFS, so
# NETWORK_SHARE_MODE turns off WAL and chown, and watching falls back to polling.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: calibre
  namespace: calibre
spec:
  serviceName: calibre
  replicas: 1
  selector:
    matchLabels:
      app: calibre
  template:
    metadata:
      labels:
        app: calibre
    spec:
      automountServiceAccountToken: false
      priorityClassName: marginal
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: calibre
        image: ghcr.io/crocodilestick/calibre-web-automated:v4.0.2@sha256:fac65096c8c69b392dc26e9f0681e928d0580931473e330faa1ab125b8374dd7
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8083
          protocol: TCP
        env:
        - name: TZ
          value: "America/Chicago"
        - name: NETWORK_SHARE_MODE
          value: "true"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: books
          mountPath: /calibre-library
        - name: ingest
          mountPath: /cwa-book-ingest
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        livenessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /
            port: 8083
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: books
        persistentVolumeClaim:
          claimName: calibre-books
      - name: ingest
        persistentVolumeClaim:
          claimName: calibre-ingest
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 5Gi
