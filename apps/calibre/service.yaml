apiVersion: v1
kind: Service
metadata:
  name: calibre
  namespace: calibre
  annotations:
    lbipam.cilium.io/sharing-key: "lan-shared"
    lbipam.cilium.io/sharing-cross-namespace: "*"
    lbipam.cilium.io/ips: "192.168.1.120"
spec:
  type: LoadBalancer
  selector:
    app: calibre
  ports:
    - name: http
      port: 8083
      targetPort: 8083
      protocol: TCP
