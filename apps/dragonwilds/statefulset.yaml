apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: dragonwilds
  namespace: dragonwilds
spec:
  serviceName: dragonwilds-server
  replicas: 1
  selector:
    matchLabels:
      app: dragonwilds
  template:
    metadata:
      labels:
        app: dragonwilds
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - bytheon
      # The game never saves on shutdown, so the stop first waits up to
      # SHUTDOWN_SAVE_TIMEOUT (90s) for the engine's own autosave to land, then
      # up to 30s for that write to settle, and only then signals —
      # STOP_TIMEOUT (120s) starts after all of it. The worst case is 240s, so
      # this is 300s: a grace period equal to the worst case is a SIGKILL
      # landing exactly on a server mid-save.
      terminationGracePeriodSeconds: 300
      containers:
        - name: dragonwilds
          # The public server browser advertises the address Epic Online
          # Services detects, which behind the tunnel is not reachable; players
          # join through the client's Direct tab with the address the START
          # message announces.
          image: ghcr.io/reclyptor/dragonwilds:20260918110251-e83e112 # {"$imagepolicy": "flux-system:dragonwilds"}
          ports:
            - name: game
              containerPort: 7780
              protocol: UDP
            # The toolkit's read-only /metrics and /healthz (no scraper yet).
            - name: metrics
              containerPort: 9110
              protocol: TCP
          # OWNER_ID, ADMIN_PASSWORD, GAME_PASSWORD, DISCORD_WEBHOOK_URL, SERVER_ADDRESS.
          # OWNER_ID is mandatory: without it the server binds the port, looks
          # healthy and never loads a world.
          envFrom:
            - secretRef:
                name: dragonwilds-secret
          env:
            # ── GameOps: nightly backups kept 14 days; players warned on Discord
            #    where the game cannot broadcast, otherwise the update waits for
            #    an empty server ──
            - name: TZ
              value: "America/Chicago"
            - name: SERVER_NAME
              value: "RuneScape Dragonwilds"
            - name: BACKUP_CRON
              value: "0 4 * * *"
            - name: BACKUP_RETAIN_DAYS
              value: "14"
            # Nightly, not hourly, and deliberately so: player join/leave log
            # lines are still unverified (Dragonwilds SPEC §7), so the toolkit
            # cannot yet be trusted to know the server is occupied, and an
            # update restarts it. 05:00 is when being wrong costs least. This
            # goes back to the fleet's hourly default once a real join has been
            # captured and the event parser confirmed.
            - name: UPDATE_CRON
              value: "0 5 * * *"
            - name: UPDATE_WARN_MINUTES
              value: "15"
            - name: UPDATE_FORCE_AFTER_MINUTES
              value: "30"
            - name: STOP_TIMEOUT
              value: "120"
            # Only players arriving and leaving ping the channel; ALL covers
            # every other event, including any a future adapter invents.
            - name: DISCORD_SILENT_EVENTS
              value: "ALL,!JOIN,!LEAVE"
            # ── Dragonwilds ──
            # The world name is what players type in the game's Public tab, and
            # it names the save slot: max 16 characters, case-sensitive.
            - name: WORLD_NAME
              value: "Dragonwilds"
            - name: PLATFORM_POLICY
              value: "Crossplay"
            # The game writes the world only on this timer and never on
            # shutdown, so it is the ceiling on what a crash can lose. The
            # game's own default is 5 minutes.
            - name: SAVE_FREQUENCY_MINUTES
              value: "1"
            - name: SHUTDOWN_SAVE_TIMEOUT
              value: "90"
            - name: CRASH_DUMPS
              value: "false"
            - name: PORT
              value: "7780"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: "2000m"
              memory: "8Gi"
          # gameops health = process alive + the world map loaded. The game port
          # is UDP and is never probed — and it binds while the server is still
          # in its startup map, so it proves nothing anyway. The first start
          # installs 5.1 GB via SteamCMD, hence the gate.
          startupProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 240
          readinessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: dragonwilds-backups
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            # 20Gi, not the fleet's 10Gi: the install alone is 5.1 GB, and the
            # toolkit's staged-reinstall fallback needs room for a second copy
            # beside it before the swap.
            storage: 20Gi
