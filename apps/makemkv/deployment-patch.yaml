apiVersion: apps/v1
kind: Deployment
metadata:
  name: all-drives
spec:
  replicas: 1
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      # The eight Blu-ray drives are physically attached to one chassis. This
      # matches the node that has them rather than naming it, so moving the
      # drives is a fleet.nix change and not a sweep through these manifests.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: hardware.reclyptor.com/optical
                    operator: In
                    values:
                      - "true"
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
      containers:
        - name: makemkv
          image: jlesage/makemkv:latest
          imagePullPolicy: Always
          securityContext:
            privileged: true
          ports:
            - name: web
              protocol: TCP
              containerPort: 5800
            - name: vnc
              protocol: TCP
              containerPort: 5900
          env:
            - name: TZ
              value: "America/Chicago"
            - name: USER_ID
              value: "0"
            - name: GROUP_ID
              value: "0"
            - name: KEEP_APP_RUNNING
              value: "1"
            - name: DISPLAY_WIDTH
              value: "1920"
            - name: DISPLAY_HEIGHT
              value: "1080"
            - name: VNC_PASSWORD
              value: ""
            - name: MAKEMKV_KEY
              valueFrom:
                secretKeyRef:
                  name: makemkv-key
                  key: key
            - name: AUTO_DISC_RIPPER
              value: "0"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: output
              mountPath: /output
          # ~400Mi each at idle across all eight drives; the ceiling covers
          # the buffering of an active rip.
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 5800
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: 5800
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        # bare entry merges with each stub's per-drive claim while keeping
        # the config volume listed before output in the rendered output
        - name: config
        - name: output
          persistentVolumeClaim:
            claimName: makemkv-output
