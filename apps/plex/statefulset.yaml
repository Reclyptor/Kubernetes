apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
  namespace: plex
spec:
  serviceName: plex
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      automountServiceAccountToken: false
      priorityClassName: critical
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      # PublishServerOnPlexOnlineKey lives only in Preferences.xml on the config
      # PVC, and pms-docker exposes no env var for it, so it cannot be declared
      # like ADVERTISE_IP. It was found "0" on 2026-10-04: Plex stayed signed in
      # but never re-announced, so plex.tv served a stale record and clients
      # rejected the server as outdated. That also makes ADVERTISE_IP inert --
      # nothing is advertised while publishing is off. Re-assert it every start.
      initContainers:
        - name: ensure-publish
          image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              pref="/config/Library/Application Support/Plex Media Server/Preferences.xml"
              key="PublishServerOnPlexOnlineKey"
              if [ ! -f "$pref" ]; then
                echo "no Preferences.xml yet (first run) - nothing to assert"
                exit 0
              fi
              cur="$(xmlstarlet sel -T -t -m /Preferences -v "@${key}" -n "$pref" || true)"
              if [ "$cur" = "1" ]; then
                echo "${key} already 1"
                exit 0
              fi
              if [ "$(xmlstarlet sel -t -v "count(/Preferences/@${key})" "$pref")" -gt 0 ]; then
                xmlstarlet ed --inplace --update "/Preferences/@${key}" -v 1 "$pref"
              else
                xmlstarlet ed --inplace --insert /Preferences --type attr -n "${key}" -v 1 "$pref"
              fi
              echo "DRIFT CORRECTED: ${key} was '${cur:-unset}', now 1"
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
          imagePullPolicy: IfNotPresent
          ports:
            - name: plex
              protocol: TCP
              containerPort: 32400
            - name: dlna-udp
              protocol: UDP
              containerPort: 1900
            - name: dlna-tcp
              protocol: TCP
              containerPort: 32469
            - name: companion
              protocol: TCP
              containerPort: 3005
            - name: gdm-1
              protocol: UDP
              containerPort: 32410
            - name: gdm-2
              protocol: UDP
              containerPort: 32412
            - name: gdm-3
              protocol: UDP
              containerPort: 32413
            - name: gdm-4
              protocol: UDP
              containerPort: 32414
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PLEX_UID
              value: "0"
            - name: PLEX_GID
              value: "0"
            # What Plex tells plex.tv its reachable addresses are. Clients
            # pick from this list, so it must name the LAN VIP, never a
            # node address: those stopped serving Plex when it moved behind the VIP.
            - name: ADVERTISE_IP
              value: "https://plex.reclyptor.com:443,http://192.168.1.120:32400"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-dxp6800
              mountPath: /media/dxp6800
              readOnly: true
            - name: media-dxp4800
              mountPath: /media/dxp4800
              readOnly: true
            - name: transcode
              mountPath: /transcode
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
          # Allows 5 minutes, enough for a database migration after an image update.
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /identity
              port: 32400
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /identity
              port: 32400
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /identity
              port: 32400
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        - name: media-dxp6800
          persistentVolumeClaim:
            claimName: plex-media
        - name: media-dxp4800
          persistentVolumeClaim:
            claimName: plex-media-dxp4800
        - name: transcode
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

