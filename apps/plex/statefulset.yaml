apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: plex
  namespace: plex
spec:
  serviceName: plex
  replicas: 1
  selector:
    matchLabels:
      app: plex
  template:
    metadata:
      labels:
        app: plex
    spec:
      automountServiceAccountToken: false
      priorityClassName: critical
      # Transcodes run on NVENC/NVDEC on bytheon. The toleration gets past the
      # taint reserving that box; the card itself is chosen by
      # NVIDIA_VISIBLE_DEVICES below (SPEC/plex-gpu1-pin.md).
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: bytheon
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      # These prefs live only in Preferences.xml on the config PVC, and
      # pms-docker exposes no env var for them, so they cannot be declared like
      # ADVERTISE_IP. Re-assert them every start.
      #
      # PublishServerOnPlexOnlineKey was found "0" on 2026-10-04: Plex stayed
      # signed in but never re-announced, so plex.tv served a stale record and
      # clients rejected the server as outdated. That also makes ADVERTISE_IP
      # inert -- nothing is advertised while publishing is off.
      #
      # HardwareAcceleratedCodecs/Encoders turn on GPU decode and encode. Off,
      # Plex ignores the GPU and software-transcodes 4K HDR on the CPU.
      initContainers:
        - name: ensure-prefs
          image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              pref="/config/Library/Application Support/Plex Media Server/Preferences.xml"
              if [ ! -f "$pref" ]; then
                echo "no Preferences.xml yet (first run) - nothing to assert"
                exit 0
              fi
              for key in PublishServerOnPlexOnlineKey HardwareAcceleratedCodecs HardwareAcceleratedEncoders; do
                cur="$(xmlstarlet sel -T -t -m /Preferences -v "@${key}" -n "$pref" || true)"
                if [ "$cur" = "1" ]; then
                  echo "${key} already 1"
                  continue
                fi
                if [ "$(xmlstarlet sel -t -v "count(/Preferences/@${key})" "$pref")" -gt 0 ]; then
                  xmlstarlet ed --inplace --update "/Preferences/@${key}" -v 1 "$pref"
                else
                  xmlstarlet ed --inplace --insert /Preferences --type attr -n "${key}" -v 1 "$pref"
                fi
                echo "DRIFT CORRECTED: ${key} was '${cur:-unset}', now 1"
              done
          volumeMounts:
            - name: config
              mountPath: /config
      containers:
        - name: plex
          image: plexinc/pms-docker:1.43.5.11079-b3b13e506@sha256:6d778d41daae68f89115aa87a44ae14a96b23e71a2093da173b5a9aac4091336
          imagePullPolicy: IfNotPresent
          ports:
            - name: plex
              protocol: TCP
              containerPort: 32400
            - name: dlna-udp
              protocol: UDP
              containerPort: 1900
            - name: dlna-tcp
              protocol: TCP
              containerPort: 32469
            - name: companion
              protocol: TCP
              containerPort: 3005
            - name: gdm-1
              protocol: UDP
              containerPort: 32410
            - name: gdm-2
              protocol: UDP
              containerPort: 32412
            - name: gdm-3
              protocol: UDP
              containerPort: 32413
            - name: gdm-4
              protocol: UDP
              containerPort: 32414
          env:
            - name: TZ
              value: "America/Chicago"
            - name: PLEX_UID
              value: "0"
            - name: PLEX_GID
              value: "0"
            # The runtime's default omits "video", which is what exposes
            # NVENC/NVDEC to the container.
            - name: NVIDIA_DRIVER_CAPABILITIES
              value: "compute,video,utility"
            # GPU 1 by UUID. NVENC and NVDEC fail ("unsupported device") in a
            # container that holds GPU 0 alone, though the card itself works,
            # and the device plugin cannot be asked for a particular card, so
            # this bypasses it: the scheduler does not count this GPU, and
            # vllm must stay parked until that is resolved.
            - name: NVIDIA_VISIBLE_DEVICES
              value: "GPU-13b49fb7-8791-de6e-3061-036fadfb5418"
            # Plex Transcoder is musl-linked and searches only FHS library
            # paths, never glibc's ld.so.cache, so it cannot find the driver
            # NixOS injects here and fails with "Cannot load libcuda.so.1".
            - name: LD_LIBRARY_PATH
              value: "/run/opengl-driver/lib"
            # What Plex tells plex.tv its reachable addresses are. Clients
            # pick from this list, so it must name the LAN VIP, never a
            # node address: those stopped serving Plex when it moved behind the VIP.
            - name: ADVERTISE_IP
              value: "https://plex.reclyptor.com:443,http://192.168.1.120:32400"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media-dxp6800
              mountPath: /media/dxp6800
              readOnly: true
            - name: media-dxp4800
              mountPath: /media/dxp4800
              readOnly: true
            - name: transcode
              mountPath: /transcode
          resources:
            requests:
              memory: "2Gi"
              cpu: "1000m"
          # Allows 5 minutes, enough for a database migration after an image update.
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /identity
              port: 32400
            periodSeconds: 5
            timeoutSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /identity
              port: 32400
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /identity
              port: 32400
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: plex-config
        - name: media-dxp6800
          persistentVolumeClaim:
            claimName: plex-media
        - name: media-dxp4800
          persistentVolumeClaim:
            claimName: plex-media-dxp4800
        - name: transcode
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain

