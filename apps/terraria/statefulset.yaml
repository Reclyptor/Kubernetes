apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: terraria
  namespace: terraria
spec:
  serviceName: terraria-server
  replicas: 1
  selector:
    matchLabels:
      app: terraria
  template:
    metadata:
      labels:
        app: terraria
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - fluxeon
      # STOP_TIMEOUT (120s) plus the save on `exit` must fit in here.
      terminationGracePeriodSeconds: 180
      containers:
        - name: terraria
          image: ghcr.io/reclyptor/terraria:20260915011806-a1ebcab # {"$imagepolicy": "flux-system:terraria"}
          ports:
            - name: game
              containerPort: 7777
              protocol: TCP
            # The toolkit's read-only /metrics and /healthz (no scraper yet).
            - name: metrics
              containerPort: 9110
              protocol: TCP
          # DISCORD_WEBHOOK_URL, SERVER_ADDRESS
          envFrom:
            - secretRef:
                name: terraria-secret
          env:
            # ── GameOps: nightly backups kept 14 days; hourly update check; players warned in-game
            #    where the game can broadcast, otherwise the update waits for an empty server ──
            - name: TZ
              value: "America/Chicago"
            - name: SERVER_NAME
              value: "Terraria"
            - name: BACKUP_CRON
              value: "0 4 * * *"
            - name: BACKUP_RETAIN_DAYS
              value: "14"
            - name: UPDATE_CRON
              value: "0 * * * *"
            - name: UPDATE_WARN_MINUTES
              value: "15"
            - name: UPDATE_FORCE_AFTER_MINUTES
              value: "30"
            - name: STOP_TIMEOUT
              value: "120"
            # ── Terraria ──
            # Size, seed and difficulty apply to the first generation only.
            - name: WORLD_NAME
              value: "world"
            - name: WORLD_SIZE
              value: "2"
            - name: DIFFICULTY
              value: "0"
            - name: MAX_PLAYERS
              value: "8"
            - name: MOTD
              value: "Welcome!"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: backups
              mountPath: /backups
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
          # gameops health = process alive + ready flag (from the console log); the
          # game port is never probed: a bare connect-and-close on 7777 can crash
          # Terraria (ObjectDisposedException in Netplay).
          startupProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["gameops", "health"]
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: terraria-backups
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 5Gi
