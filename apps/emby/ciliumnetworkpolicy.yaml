apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: emby
  namespace: emby
spec:
  endpointSelector:
    matchLabels:
      app: emby
  ingress:
    - fromEntities: [world, remote-node]
      toPorts:
        - ports:
            - { port: "8096", protocol: TCP }
            - { port: "8920", protocol: TCP }
            - { port: "7359", protocol: UDP }
            - { port: "1900", protocol: UDP }
    # Remote family via the tailnet subnet router (forwarded to HTTP only).
    - fromEndpoints:
        - matchLabels:
            app: tailscale
            k8s:io.kubernetes.pod.namespace: tailscale
      toPorts:
        - ports: [{ port: "8096", protocol: TCP }]
  egress:
    - toEntities: [host]
      toPorts:
        - ports: [{ port: "53", protocol: ANY }]
          rules:
            dns: [{ matchPattern: "*" }]
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "443", protocol: TCP }]
    - toEntities: [world]
      toPorts:
        - ports: [{ port: "1900", protocol: UDP }]
    # Authentik-backed logins via the LDAP outpost.
    - toEndpoints:
        - matchLabels:
            app: authentik-ldap
            k8s:io.kubernetes.pod.namespace: authentik
      toPorts:
        - ports:
            - { port: "3389", protocol: TCP }
            - { port: "6636", protocol: TCP }
