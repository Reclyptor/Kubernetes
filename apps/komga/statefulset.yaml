# Libraries are mounted read-only and added in the web UI. Komga never writes
# to them, and all of its state lives on the config volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: komga
  namespace: komga
spec:
  serviceName: komga
  replicas: 1
  selector:
    matchLabels:
      app: komga
  template:
    metadata:
      labels:
        app: komga
    spec:
      automountServiceAccountToken: false
      priorityClassName: marginal
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      containers:
      - name: komga
        image: ghcr.io/gotson/komga:1.30.1@sha256:d43bb3b57aeeafd274ea805214f5da71ff9306accf012fb14cc13dedc3307212
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 25600
          protocol: TCP
        env:
        - name: TZ
          value: "America/Chicago"
        - name: SERVER_PORT
          value: "25600"
        volumeMounts:
        - name: config
          mountPath: /config
        - name: library-1
          mountPath: /libraries/1
          readOnly: true
        - name: library-2
          mountPath: /libraries/2
          readOnly: true
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 25600
          initialDelaySeconds: 45
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 25600
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: library-1
        persistentVolumeClaim:
          claimName: komga-library-1
      - name: library-2
        persistentVolumeClaim:
          claimName: komga-library-2
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: iscsi-persistent-fs6712x
        resources:
          requests:
            storage: 5Gi
