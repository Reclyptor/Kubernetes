apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: komga-library-1
  namespace: komga
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-komga-library-1
  volumeName: komga-library-1-dxp4800
  resources:
    requests:
      storage: 1Mi
