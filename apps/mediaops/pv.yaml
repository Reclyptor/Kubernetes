# The whole media root on this box, read-write. Work spans the staging trees and
# every category directory in a single operation -- an archive-then-promote move
# crosses three of them. Narrower mounts would not shrink the blast radius, only
# obscure it.
#
# The categories now live on two boxes, so there are two of these and both mount
# under MEDIA_ROOT. mkv-promote joins MEDIA_ROOT with manifest-relative paths, so
# a move that crosses boxes is only expressible if both sit beneath it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaops-media-dxp6800
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-mediaops-media
  nfs:
    server: 192.168.1.2
    path: /mnt/primary/videos
    # This export squashes every client to 3000:3000, so anything created here
    # lands group 3000 whatever the pod's runAsGroup says, and chown/chgrp fail
    # with EPERM. The pod still writes everything because uid 3000 owns it all;
    # set modes (770) and leave ownership alone. rsync -a fails here (code 23)
    # trying to keep the source group, so copies in use -rt --chmod=F770.
---
# The second box. shutil.move falls back to copy+unlink across a device
# boundary, so cross-box promotes work; they just copy instead of renaming.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaops-media-dxp4800
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-mediaops-media-dxp4800
  nfs:
    server: 192.168.1.3
    path: /mnt/primary/videos
---
# The torrent staging box, read-write. Normalisation runs against files that
# land here and promotes the finished tree onto the media root above; doing the
# heavy work in-pod keeps ~25 GiB of remux traffic per episode on the cluster's
# network instead of round-tripping through a workstation mount.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaops-asustor
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-mediaops-asustor
  nfs:
    server: 192.168.1.5
    path: /volume1/data
---
# The ripper's view of dxp6800: the staging tree and nothing above it. The same
# export and squash as mediaops-media-dxp6800 (3000:3000; set modes, never
# chown). A subdirectory mount of this export is proven: makemkv-output mounts
# the same path.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaops-rip-staging-dxp6800
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-mediaops-rip-staging
  nfs:
    server: 192.168.1.2
    path: /mnt/primary/videos/_pending
