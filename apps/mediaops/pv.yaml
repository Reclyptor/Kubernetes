# The whole media root on this box, read-write. Work spans the staging trees and
# every category directory in a single operation -- an archive-then-promote move
# crosses three of them. Narrower mounts would not shrink the blast radius, only
# obscure it.
#
# The categories now live on two boxes, so there are two of these and both mount
# under MEDIA_ROOT. mkv-promote joins MEDIA_ROOT with manifest-relative paths, so
# a move that crosses boxes is only expressible if both sit beneath it.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaops-media-dxp6800
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-mediaops-media
  nfs:
    server: 192.168.1.2
    path: /mnt/primary/videos
---
# The second box. shutil.move falls back to copy+unlink across a device
# boundary, so cross-box promotes work; they just copy instead of renaming.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaops-media-dxp4800
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-mediaops-media-dxp4800
  nfs:
    server: 192.168.1.3
    path: /mnt/primary/videos
---
# The torrent staging box, read-write. Normalisation runs against files that
# land here and promotes the finished tree onto the media root above; doing the
# heavy work in-pod keeps ~25 GiB of remux traffic per episode on the cluster's
# network instead of round-tripping through a workstation mount.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mediaops-asustor
spec:
  capacity:
    storage: 1Mi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: nfs-mediaops-asustor
  nfs:
    server: 192.168.1.5
    path: /volume1/data
