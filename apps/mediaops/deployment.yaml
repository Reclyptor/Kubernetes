apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediaops
  namespace: mediaops
spec:
  replicas: 1
  # A workbench, not a service: it holds no state worth preserving across a
  # restart, and two pods sharing a read-write mount on the media root is a
  # hazard rather than a benefit. Replace outright.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mediaops
  template:
    metadata:
      labels:
        app: mediaops
    spec:
      automountServiceAccountToken: false
      priorityClassName: negligible
      securityContext:
        # Matches every file under /mnt/primary/videos (3000:100, mode 770). The
        # image has no root path at runtime, so a root-owned media file cannot
        # be produced even by accident.
        runAsUser: 3000
        runAsGroup: 100
        runAsNonRoot: true
        fsGroup: 100
        # /mnt/media is 3000:100, but the asustor tree is owned 1000:1000. The
        # supplementary group is what makes the second mount writable; without
        # it the pod can read the staging box and nothing more.
        supplementalGroups:
        - 1000
        seccompProfile:
          type: RuntimeDefault
      # Ripping lives in mediaops-rip, so nothing here needs the drives. The NAS
      # path is much faster from the 10G node (the others are 2.5G), and only
      # that node carries the capability label, which the NixOS fleet declares.
      # Preferred, not required, so a drain moves the workbench instead of
      # stopping it. It returns to the 10G node on its next roll, not on uncordon.
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: network.reclyptor.com/10g
                operator: In
                values:
                - "true"
      containers:
      - name: mediaops
        image: ghcr.io/reclyptor/mediaops:20261113215123-36079f1 # {"$imagepolicy": "flux-system:mediaops"}
        imagePullPolicy: Always
        # This pod fetches untrusted web content (see the network policy), so it
        # gets no privilege and no capabilities. The disc tools live in
        # mediaops-rip; the role guard in the image refuses them here.
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        env:
        - name: TZ
          value: "America/Chicago"
        - name: MEDIA_ROOT
          value: /mnt/media
        # Superseded files go to one tree on the box that is not being worked,
        # rather than to a sibling of each share, so the archive stops consuming
        # space on the box that is actually being read. No default exists in
        # code on purpose: a guessed archive path resolves to the pod's overlay,
        # accepts the write, reports success, and is discarded at the next image
        # roll.
        #
        # The value comes from a Secret rather than sitting here, because this
        # repository is public and the rule for it is to name dataset roots and
        # never enumerate what lives beneath them. The set of names is itself
        # the thing worth not publishing; this one would be a hole in that.
        - name: ARCHIVE_ROOT
          valueFrom:
            secretKeyRef:
              name: mediaops-secret
              key: ARCHIVE_ROOT
        # The image gives `media` no home directory, so fontconfig has nowhere to
        # cache and floods every drawtext call with "No writable cache
        # directories". The labels still render, which is the danger: pages of
        # benign noise are exactly what a real error hides in.
        - name: HOME
          value: /work
        - name: XDG_CACHE_HOME
          value: /work/.cache
        volumeMounts:
        - name: media-dxp6800
          mountPath: /mnt/media/dxp6800
        - name: media-dxp4800
          mountPath: /mnt/media/dxp4800
        - name: asustor
          mountPath: /mnt/media/asustor
        - name: work
          mountPath: /work
        # Idles cheap -- it is asleep most of the time -- but bursts wide when a
        # split batch runs. The modest request is what has to fit wherever the
        # scheduler lands it; the burst is absorbed by whichever node takes it.
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "12"
            memory: 16Gi
        livenessProbe:
          exec:
            command: ["mkvmerge", "--version"]
          initialDelaySeconds: 15
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: media-dxp6800
        persistentVolumeClaim:
          claimName: mediaops-media
      - name: media-dxp4800
        persistentVolumeClaim:
          claimName: mediaops-media-dxp4800
      - name: asustor
        persistentVolumeClaim:
          claimName: mediaops-asustor
      - name: work
        emptyDir: {}
