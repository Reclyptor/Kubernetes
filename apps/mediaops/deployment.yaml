apiVersion: apps/v1
kind: Deployment
metadata:
  name: mediaops
  namespace: mediaops
spec:
  replicas: 1
  # A workbench, not a service: it holds no state worth preserving across a
  # restart, and two pods sharing a read-write mount on the media root is a
  # hazard rather than a benefit. Replace outright.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mediaops
  template:
    metadata:
      labels:
        app: mediaops
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Matches every file under /mnt/primary/videos (3000:100, mode 770). The
        # image has no root path at runtime, so a root-owned media file cannot
        # be produced even by accident.
        runAsUser: 3000
        runAsGroup: 100
        fsGroup: 100
        # /mnt/media is 3000:100, but the asustor tree is owned 1000:1000. The
        # supplementary group is what makes the second mount writable; without
        # it the pod can read the staging box and nothing more.
        supplementalGroups:
        - 1000
        # cdrom. The host gives the optical drives' /dev/sr* and /dev/sg* nodes
        # to this group, so it is what lets uid 3000 rip. Group 6 (disk) is
        # deliberately absent: it would open every block device on the node.
        - 24
      # The workbench also rips discs, so it has to run where the drives are.
      # This matches the node by label, the same way the parked makemkv GUIs
      # did, so moving the drives is a fleet.nix change and nothing here.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: hardware.reclyptor.com/optical
                operator: In
                values:
                - "true"
      containers:
      - name: mediaops
        image: ghcr.io/reclyptor/mediaops:20261110024543-b5e050e # {"$imagepolicy": "flux-system:mediaops"}
        imagePullPolicy: Always
        # Privileged only so the optical drives' device nodes exist in the
        # container. Device access cannot be granted per node without a device
        # plugin, and the drives' sg numbers change whenever the hub
        # re-enumerates. The process stays uid 3000 with no capabilities.
        #
        # Known, accepted risk: this pod also fetches untrusted web content (see
        # the network policy), and it can now see every device node on styxeon.
        # Group membership above is what limits which of them it can open.
        securityContext:
          privileged: true
        env:
        # Read by mkv-rip, which writes it into MakeMKV's settings under /work
        # and never onto the NAS.
        - name: MAKEMKV_KEY
          valueFrom:
            secretKeyRef:
              name: makemkv-key
              key: key
        - name: TZ
          value: "America/Chicago"
        - name: MEDIA_ROOT
          value: /mnt/media
        # Superseded files go to one tree on the box that is not being worked,
        # rather than to a sibling of each share, so the archive stops consuming
        # space on the box that is actually being read. No default exists in
        # code on purpose: a guessed archive path resolves to the pod's overlay,
        # accepts the write, reports success, and is discarded at the next image
        # roll.
        #
        # The value comes from a Secret rather than sitting here, because this
        # repository is public and the rule for it is to name dataset roots and
        # never enumerate what lives beneath them. The set of names is itself
        # the thing worth not publishing; this one would be a hole in that.
        - name: ARCHIVE_ROOT
          valueFrom:
            secretKeyRef:
              name: mediaops-secret
              key: ARCHIVE_ROOT
        # The image gives `media` no home directory, so fontconfig has nowhere to
        # cache and floods every drawtext call with "No writable cache
        # directories". The labels still render, which is the danger: pages of
        # benign noise are exactly what a real error hides in.
        - name: HOME
          value: /work
        - name: XDG_CACHE_HOME
          value: /work/.cache
        volumeMounts:
        - name: media-dxp6800
          mountPath: /mnt/media/dxp6800
        - name: media-dxp4800
          mountPath: /mnt/media/dxp4800
        - name: asustor
          mountPath: /mnt/media/asustor
        - name: work
          mountPath: /work
        # Idles cheap -- it is asleep most of the time -- but bursts wide when a
        # split batch runs. Placement is left to the scheduler, so the modest
        # request is what has to fit; the burst is absorbed by whichever node
        # takes it.
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "12"
            memory: 16Gi
        livenessProbe:
          exec:
            command: ["mkvmerge", "--version"]
          initialDelaySeconds: 15
          periodSeconds: 60
          timeoutSeconds: 10
          failureThreshold: 3
      volumes:
      - name: media-dxp6800
        persistentVolumeClaim:
          claimName: mediaops-media
      - name: media-dxp4800
        persistentVolumeClaim:
          claimName: mediaops-media-dxp4800
      - name: asustor
        persistentVolumeClaim:
          claimName: mediaops-asustor
      - name: work
        emptyDir: {}
