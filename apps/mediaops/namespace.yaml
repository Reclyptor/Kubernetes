apiVersion: v1
kind: Namespace
metadata:
  name: mediaops
  # Privileged because mediaops-rip needs the optical drives' device nodes (see
  # its Deployment). The library workbench asks for no privilege, but PSA is
  # per namespace, so it cannot be held to baseline separately. Under baseline
  # the API server would reject the ripper, and with Recreate the old pod would
  # already be gone.
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
