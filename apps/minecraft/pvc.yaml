# Archives live on fs6712x, next to the game data.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-backups
  namespace: minecraft
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: iscsi-persistent-fs6712x
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minecraft-makoto-backups
  namespace: minecraft
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: iscsi-persistent-fs6712x
  resources:
    requests:
      storage: 20Gi
