apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gotify
  namespace: gotify
spec:
  endpointSelector:
    matchLabels:
      app: gotify
  ingress:
    # blackbox probes /health (SPEC/monitoring-stack.md).
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus-blackbox-exporter
            k8s:io.kubernetes.pod.namespace: monitoring
      toPorts:
        - ports: [{ port: "80", protocol: TCP }]
    - fromEntities: [world, remote-node]
      toPorts:
        - ports: [{ port: "80", protocol: TCP }]
    - fromEndpoints:
        - matchLabels:
            app: cloudflare
            k8s:io.kubernetes.pod.namespace: cloudflare
      toPorts:
        - ports: [{ port: "80", protocol: TCP }]
